  // ─── Calendar (next 14 days due forecast) ───────────────────────────────
  function showCalendar() {
    setActiveView('calendar');
    var main = document.getElementById('main');
    if (!STATIC) { main.innerHTML = '<div class="status-msg">Loading…</div>'; return; }

    var DAY = 86400000;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayMs = today.getTime();

    // Bucket every card-state row by which day it's due (clamped to today
    // for anything overdue, then the next 14 days, then "later").
    var buckets = []; // { ms, label, sub, count, isToday }
    for (var i = 0; i < 14; i++) {
      var d = new Date(todayMs + i * DAY);
      buckets.push({
        ms: d.getTime(),
        label: weekday(d) + ', ' + monthDay(d),
        sub: i === 0 ? 'today' : (i === 1 ? 'tomorrow' : ''),
        count: 0,
        isToday: i === 0,
      });
    }
    var laterBucket = { ms: todayMs + 14 * DAY, label: '14+ days', sub: '', count: 0, isToday: false };
    var overdueCount = 0;
    var newCount = 0;
    var totalScheduled = 0;

    // Walk every card across both decks
    var allCards = [];
    Object.keys(STATIC.cardsByDeck).forEach(function (deckId) {
      allCards = allCards.concat(STATIC.cardsByDeck[deckId]);
    });

    allCards.forEach(function (c) {
      var s = USER_STATE[c.id];
      if (!s) { newCount++; return; }
      if (!s.due) { newCount++; return; }
      var dueMs = new Date(s.due).getTime();
      if (dueMs < todayMs) { overdueCount++; return; }
      totalScheduled++;
      // Find the bucket
      var idx = Math.floor((dueMs - todayMs) / DAY);
      if (idx < 0) idx = 0;
      if (idx < 14) buckets[idx].count++;
      else laterBucket.count++;
    });

    // Buckets that count overdue belong to "today" too — overdue is due now
    if (buckets.length) buckets[0].count += overdueCount;

    // Augment today's bucket with reviewed-count + goal-progress info,
    // sharing the same todayGoal denominator the banner above uses so
    // the numbers always match.
    var ts0 = getTodayStats();
    if (buckets.length) {
      buckets[0].doneToday = ts0.reviewedToday;
      buckets[0].todayGoal = ts0.todayGoal;
      buckets[0].dueRemaining = buckets[0].count; // already includes overdue
      buckets[0].goalPct = ts0.todayGoal > 0
        ? Math.min(100, Math.round(100 * ts0.reviewedToday / ts0.todayGoal))
        : 100;
    }

    // Forward-project with MAX_PER_DAY cap: simulate day-by-day.
    // If a day's FSRS-due reviews alone exceed MAX, the excess spills
    // forward to the next day (they'll be "overdue" by then). New cards
    // only fill remaining budget after due reviews are accounted for.
    var unseenLeft = countUnseenCards();
    var dailyTargetN = getDailyTarget();
    var maxPerDay = getMaxPerDay();
    var totalDaysWithNew = 0;
    // Spillover: due cards that couldn't fit today defer to tomorrow
    var spillover = Math.max(0, buckets[0].count - maxPerDay);
    buckets[0].newPlanned = 0;

    for (var i = 1; i < buckets.length; i++) {
      // Raw due = FSRS-scheduled for this day + overflow from prior days
      var rawDue = buckets[i].count + spillover;
      spillover = 0;

      // If due alone exceeds MAX, cap it and spill the rest forward
      if (rawDue > maxPerDay) {
        spillover = rawDue - maxPerDay;
        rawDue = maxPerDay;
      }

      // New cards fill whatever budget remains after due reviews
      var newBudget = Math.max(0, maxPerDay - rawDue);
      var planned = Math.min(dailyTargetN, unseenLeft, newBudget);

      buckets[i].count = rawDue;
      buckets[i].newPlanned = planned;
      if (planned > 0) totalDaysWithNew++;
      unseenLeft -= planned;
    }
    // Any remaining spillover beyond 14 days lands in the overflow bucket
    if (spillover > 0) laterBucket.count += spillover;
    laterBucket.newPlanned = 0;

    var maxCount = Math.max(
      1,
      buckets.reduce(function (m, b) { return Math.max(m, b.count + (b.newPlanned || 0)); }, 0),
      laterBucket.count
    );

    // Today's goal banner: a fresh user reads this and knows what "enough"
    // looks like today. The denominator (todayGoal) is the SAME number used
    // everywhere else (in-card progress strip, calendar today-row), capped
    // at MAX_PER_DAY. No more "39 vs 25" confusion.
    var ts = getTodayStats();
    var goalDone = ts.reviewedToday;
    var goalTotal = ts.todayGoal;
    var goalPct = goalTotal > 0 ? Math.min(100, Math.round(100 * goalDone / goalTotal)) : 100;
    // Subtitle breaks down the goal denominator so the user sees where it
    // comes from: X due + Y new = MAX cap (or whatever's available).
    var newPart = ts.newRemaining;
    var duePart = Math.max(0, ts.totalGoal - newPart);
    var goalSubtitle;
    if (goalTotal === 0 || ts.totalGoal === 0) {
      goalSubtitle = goalDone > 0
        ? "You've practiced " + goalDone + " today. Come back tomorrow for the next batch."
        : "Nothing to study right now. Come back when something comes due below.";
    } else {
      var parts = [];
      if (duePart > 0) parts.push(duePart + ' due');
      if (newPart > 0) parts.push(newPart + ' new');
      goalSubtitle = (goalDone > 0 ? (goalDone + ' done, ') : '') + parts.join(' + ') + ' to go today.';
    }
    var goalBanner = '<div class="goal-banner">'
                   + '<div class="goal-row">'
                     + '<span class="goal-label">Today\'s goal</span>'
                     + '<span class="goal-count">' + goalDone + ' / ' + goalTotal + '</span>'
                   + '</div>'
                   + '<div class="goal-bar"><span class="goal-bar-fill" style="width:' + goalPct + '%"></span></div>'
                   + '<p class="goal-sub">' + escapeHtml(goalSubtitle) + '</p>'
                 + '</div>';

    // Two chip strips: NEW cap (introductions) + MAX cap (total daily goal).
    // MAX must always be >= NEW; the setter enforces that.
    var currentNew = getDailyTarget();
    var currentMax = getMaxPerDay();
    var newPresets = [
      { n: 5,  label: 'Gentle' },
      { n: 10, label: 'Standard' },
      { n: 15, label: 'Eager' },
      { n: 20, label: 'Intensive' },
      { n: 30, label: 'Power' },
    ];
    var maxPresets = [
      { n: 15,  label: 'Light' },
      { n: 30,  label: 'Standard' },
      { n: 50,  label: 'Committed' },
      { n: 80,  label: 'Heavy' },
      { n: 150, label: 'Intense' },
    ];
    function renderChips(presets, current, attr) {
      return presets.map(function (p) {
        return '<button type="button" class="target-chip' + (p.n === current ? ' active' : '') + '" data-' + attr + '="' + p.n + '">'
             + '<span class="chip-num">' + p.n + '</span>'
             + '<span class="chip-lbl">' + escapeHtml(p.label) + '</span>'
             + '</button>';
      }).join('');
    }
    var newChips = renderChips(newPresets, currentNew, 'new-target');
    var maxChips = renderChips(maxPresets, currentMax, 'max-target');
    var settingsStrip = '<div class="goal-settings">'
                      + '<div class="goal-settings-head">'
                        + '<span class="goal-settings-title">New cards per day</span>'
                        + '<span class="goal-settings-current">' + currentNew + '</span>'
                      + '</div>'
                      + '<div class="target-chips">' + newChips + '</div>'
                      + '<div class="goal-settings-head" style="margin-top:14px">'
                        + '<span class="goal-settings-title">Max cards per day (incl. practice)</span>'
                        + '<span class="goal-settings-current">' + currentMax + '</span>'
                      + '</div>'
                      + '<div class="target-chips">' + maxChips + '</div>'
                      + '<p class="goal-settings-hint">Pick a number you can hit <em>every single day</em>. Daily five beats weekly fifty. Below 5 the spacing rhythm starts to break down; above 20 the daily practice pile compounds and most learners quit within a fortnight.</p>'
                      + '<details class="goal-science">'
                        + '<summary>Why these numbers matter</summary>'
                        + '<div class="goal-science-body">'
                          + '<p><strong>The forgetting curve (Ebbinghaus, 1885)</strong> — we lose roughly half of new information within 24 hours and ~70% within a week unless something brings it back. Spacing the review just before you would have forgotten is what turns short daily practice into long-term retention.</p>'
                          + '<p><strong>SuperMemo (Piotr Wozniak, 1987 onwards)</strong> turned that observation into the SM-family of algorithms. Anki popularised SM-2. The app you\'re holding uses <a href="https://github.com/open-spaced-repetition/fsrs4anki" target="_blank" rel="noopener">FSRS-4.5</a> (Jarrett Ye et al, 2023) which models three latent variables per card — Difficulty, Stability, Retrievability — and schedules each review at the moment your retention probability hits 90%. That target retention of 0.9 is the published sweet spot: lower wastes reviews on cards you still know, higher drowns you in re-reviews of cards you keep forgetting.</p>'
                          + '<p><strong>Why a daily cap on new cards</strong> — every new card you start today adds roughly 0.7 to 1.5 future reviews per day to your steady-state load, depending on its difficulty. At 10 new/day the mature daily review queue settles around 25 to 40 cards total, about 5 to 10 minutes per day. At 30 new/day it piles up to 80 to 120 daily reviews, 30 to 45 minutes — and the public Anki / SuperMemo retention surveys (Wozniak\'s own user data, Anki community polls) show drop-off accelerates sharply past ~30 daily minutes.</p>'
                          + '<p><strong>Cognitive interference</strong> is the second cap. Adult vocabulary-acquisition research (Pimsleur 1967, Nation 2001, Krashen) consistently finds that introducing more than around 15 to 20 new items in one sitting causes the items to blur into each other — you remember the <em>list</em> rather than the individual words. The 10-per-day default keeps each new lemma well under that threshold and gives every word at least one isolated retrieval before the next batch arrives.</p>'
                          + '<p>So the practical heuristic: <em>diminishing returns are real and they hit fast above 20</em>. Sustainable rhythm beats heroic sessions. The cap is here to protect future you from past you.</p>'
                        + '</div>'
                      + '</details>'
                    + '</div>';

    var html = '<div class="view-header">'
             + '<span class="eyebrow">Forecast</span>'
             + '<h2>Next two weeks</h2>'
             + '<p class="lede">Each day shows the practice FSRS scheduled (from your Hard / Good / Easy ratings) plus the ' + getDailyTarget() + ' new cards planned that day. Daily goal is capped at <strong>' + getMaxPerDay() + '</strong> total (the rest defer; FSRS staggers intervals so cards don\'t pile up). Tap any row with cards due to preview the Latin.</p>'
             + '</div>'
             + goalBanner
             + settingsStrip
             + '<div class="forecast-summary">'
               + '<div class="stat"><div class="num">' + (overdueCount + buckets[0].count - overdueCount) + '</div><div class="lbl">Due today</div></div>'
               + '<div class="stat"><div class="num">' + newCount + '</div><div class="lbl">New cards</div></div>'
               + '<div class="stat"><div class="num">' + (totalScheduled + overdueCount) + '</div><div class="lbl">In rotation</div></div>'
             + '</div>'
             + '<div class="forecast-list">';
    buckets.forEach(function (b) {
      if (b.isToday) {
        // Today's row mirrors the banner: "X / TODAY_GOAL" using the same
        // denominator everywhere. Bar fills to that goal's progress.
        // Right-stack: big "14 / 19" + small "9 DUE · 10 NEW" underneath,
        // both in burgundy so the breakdown is readable.
        var done = b.doneToday || 0;
        var goal = b.todayGoal || 0;
        var rightLabel = goal > 0 ? (done + ' / ' + goal) : (done + ' done');
        var planNew = (ts0.newIntroducedToday || 0) + (ts0.newRemaining || 0);
        if (planNew > goal) planNew = goal;
        var planDue = Math.max(0, goal - planNew);
        var todayBreakdown = goal > 0 ? (planDue + ' due · ' + planNew + ' new') : '';
        html += '<div class="forecast-row today' + (done === 0 && goal === 0 ? ' empty' : '') + '" data-bucket="0">'
              + '<span class="day">' + escapeHtml(b.label)
                + '<span class="sub">today</span>'
              + '</span>'
              + '<span class="bar-wrap"><span class="bar" style="width:' + (b.goalPct || 0) + '%"></span></span>'
              + '<span class="count-stack">'
                + '<span class="num">' + escapeHtml(rightLabel) + '</span>'
                + (todayBreakdown ? '<span class="breakdown">' + escapeHtml(todayBreakdown) + '</span>' : '')
              + '</span>'
              + '</div>';
      } else {
        var due = b.count;
        var newP = b.newPlanned || 0;
        var total = due + newP;
        var pct = Math.round(100 * total / maxCount);
        var subParts = [];
        if (b.sub) subParts.push(b.sub);
        var subLabel = subParts.join(' · ');
        var breakdown = total > 0 ? (due + ' due · ' + newP + ' new') : '';
        var bucketIdx = buckets.indexOf(b);
        html += '<div class="forecast-row' + (total === 0 ? ' empty' : '') + (due > 0 ? ' has-preview' : '') + '" data-bucket="' + bucketIdx + '">'
              + '<span class="day">' + escapeHtml(b.label)
                + (subLabel ? '<span class="sub">' + escapeHtml(subLabel) + '</span>' : '')
              + '</span>'
              + '<span class="bar-wrap"><span class="bar" style="width:' + pct + '%"></span></span>'
              + '<span class="count-stack">'
                + '<span class="num">' + total + '</span>'
                + (breakdown ? '<span class="breakdown">' + escapeHtml(breakdown) + '</span>' : '')
              + '</span>'
              + '</div>';
      }
    });
    if (laterBucket.count > 0) {
      var pct2 = Math.round(100 * laterBucket.count / maxCount);
      html += '<div class="forecast-row empty">'
            + '<span class="day">' + escapeHtml(laterBucket.label) + '</span>'
            + '<span class="bar-wrap"><span class="bar" style="width:' + pct2 + '%;background:var(--taupe)"></span></span>'
            + '<span class="count">' + laterBucket.count + '</span>'
            + '</div>';
    }
    html += '</div>';
    main.innerHTML = html;

    // Wire NEW + MAX preset chips. Each chip carries either data-new-target
    // or data-max-target; the right setter is called and the view re-renders.
    document.querySelectorAll('.target-chip[data-new-target]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setDailyTarget(parseInt(btn.dataset.newTarget, 10));
        showCalendar();
      });
    });
    document.querySelectorAll('.target-chip[data-max-target]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setMaxPerDay(parseInt(btn.dataset.maxTarget, 10));
        showCalendar();
      });
    });

    // Click on any forecast row with due reviews to preview the Latin
    // terms scheduled for that day (most-frequent first). Click again to
    // collapse. Latin only -- no English -- so previewing doesn't spoil
    // upcoming recalls.
    document.querySelectorAll('.forecast-row[data-bucket]').forEach(function (row) {
      row.addEventListener('click', function () {
        toggleDayPreview(row, parseInt(row.dataset.bucket, 10));
      });
    });
  }

  function toggleDayPreview(row, idx) {
    var existing = row.nextElementSibling;
    if (existing && existing.classList.contains('day-preview')) {
      existing.remove();
      row.classList.remove('expanded');
      return;
    }
    var terms = listLatinForDay(idx);
    if (!terms.length) {
      // No revisions on this day; show a friendly note rather than nothing
      var emptyEl = document.createElement('div');
      emptyEl.className = 'day-preview empty';
      emptyEl.textContent = idx === 0
        ? 'Nothing to practice today.'
        : 'Nothing scheduled to revise that day yet.';
      row.parentNode.insertBefore(emptyEl, row.nextSibling);
      row.classList.add('expanded');
      return;
    }
    var ul = '<ul class="day-preview-list">';
    terms.forEach(function (t) {
      ul += '<li lang="la"><span class="dp-lat">' + escapeHtml(t.latin) + '</span>'
          + (t.pos ? '<span class="dp-pos">' + escapeHtml(t.pos) + '</span>' : '')
          + '</li>';
    });
    ul += '</ul>';
    var el = document.createElement('div');
    el.className = 'day-preview';
    el.innerHTML = ul;
    row.parentNode.insertBefore(el, row.nextSibling);
    row.classList.add('expanded');
  }

  // Walks USER_STATE to find every card whose due timestamp lands in the
  // requested day-bucket, returns { latin, pos } sorted by note frequency
  // descending (most-frequent-in-the-Mass first).
  function listLatinForDay(bucketIdx) {
    var DAY_MS = 86400000;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayStartMs = today.getTime();
    var startMs = todayStartMs + bucketIdx * DAY_MS;
    var endMs = startMs + DAY_MS;
    var out = [];
    Object.keys(USER_STATE).forEach(function (cidStr) {
      var s = USER_STATE[cidStr];
      if (!s || !s.due || (s.reps || 0) === 0) return;
      var dueMs = new Date(s.due).getTime();
      // Day 0 (today) catches overdue too
      if (bucketIdx === 0) {
        if (dueMs >= endMs) return;
      } else {
        if (dueMs < startMs || dueMs >= endMs) return;
      }
      // Find the card -> note
      var cid = parseInt(cidStr, 10);
      var card = null;
      for (var dId in STATIC.cardsByDeck) {
        var arr = STATIC.cardsByDeck[dId];
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].id === cid) { card = arr[i]; break; }
        }
        if (card) break;
      }
      if (!card) return;
      var note = STATIC.notesById[card.note_id];
      if (!note) return;
      out.push({
        latin: note.latin,
        pos: note.pos || (note.role ? formatRole(note.role) : ''),
        freq: note.frequency || 0,
      });
    });
    out.sort(function (a, b) { return b.freq - a.freq; });
    return out;
  }

  // ─── Stats (heatmap, streak, retention, totals) ─────────────────────────
  function showStats() {
    setActiveView('stats');
    var main = document.getElementById('main');
    main.innerHTML = '<div class="status-msg">Loading stats…</div>';

    // Pull last 90 days of review log for heatmap + streak + retention
    var sinceISO = new Date(Date.now() - 90 * 86400000).toISOString();
    var path = '/user_review_log?select=review_time,rating&review_time=gte.' + encodeURIComponent(sinceISO)
             + '&order=review_time.asc&limit=20000';
    rest(path, SESSION).then(function (rows) {
      renderStats(rows || []);
    }).catch(function (err) {
      showErr('Failed to load stats: ' + (err.message || err));
    });
  }

  function renderStats(rows) {
    var main = document.getElementById('main');
    var DAY = 86400000;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayMs = today.getTime();

    // Bucket reviews by local-day key
    var byDay = {}; // 'YYYY-MM-DD' -> { total, again, hard, good, easy }
    rows.forEach(function (r) {
      var d = new Date(r.review_time);
      var key = isoDate(d);
      var b = byDay[key];
      if (!b) b = byDay[key] = { total: 0, again: 0, hard: 0, good: 0, easy: 0 };
      b.total++;
      if (r.rating === 1) b.again++;
      else if (r.rating === 2) b.hard++;
      else if (r.rating === 3) b.good++;
      else if (r.rating === 4) b.easy++;
    });

    // Streak: count consecutive days back from today with at least one
    // review OR a freeze applied (see tlm_freezes_used). A freeze is a
    // user-deployed "skip day" that preserves the streak without faking
    // an actual practice; see the freeze-card UI below.
    var freezesUsed = (function () {
      try { return JSON.parse(localStorage.getItem('tlm_freezes_used') || '[]'); } catch (_) { return []; }
    })();
    var freezeSet = {};
    freezesUsed.forEach(function (k) { freezeSet[k] = true; });
    var streak = 0;
    for (var i = 0; i < 365; i++) {
      var d = new Date(todayMs - i * DAY);
      var k = isoDate(d);
      if (byDay[k] || freezeSet[k]) streak++;
      else if (i === 0) {
        // No review today yet -- but if yesterday had reviews (or a freeze
        // applied), the streak is still alive, just not extended yet.
        var y = new Date(todayMs - DAY);
        var yk = isoDate(y);
        if (byDay[yk] || freezeSet[yk]) continue;
        else break;
      } else break;
    }
    // Freeze availability: 1 per 7 days from last use. Cooldown gating only.
    var lastFreezeAt = 0;
    try { lastFreezeAt = parseInt(localStorage.getItem('tlm_last_freeze_at') || '0', 10) || 0; } catch (_) {}
    var freezeReadyAt = lastFreezeAt + 7 * DAY;
    var freezeAvailable = Date.now() >= freezeReadyAt;
    var todayKey = isoDate(new Date());
    var freezeAlreadyAppliedToday = !!freezeSet[todayKey];

    // Retention rate over last 30 days = % rating >= 3 (Good/Easy)
    var ret_total = 0, ret_pass = 0;
    var thirtyAgo = todayMs - 30 * DAY;
    rows.forEach(function (r) {
      var t = new Date(r.review_time).getTime();
      if (t < thirtyAgo) return;
      ret_total++;
      if (r.rating >= 3) ret_pass++;
    });
    var retention = ret_total > 0 ? Math.round(100 * ret_pass / ret_total) : null;

    // Rating breakdown — last 30 days
    var rb = { 1: 0, 2: 0, 3: 0, 4: 0 };
    rows.forEach(function (r) {
      var t = new Date(r.review_time).getTime();
      if (t < thirtyAgo) return;
      if (rb[r.rating] !== undefined) rb[r.rating]++;
    });

    // Heatmap grid: 90 cells, one per day, oldest first so columns advance L→R.
    // Pad with leading empties so the rightmost column is "today" and rows are
    // weekdays (Sun=0 at top).
    var cells = [];
    for (var j = 89; j >= 0; j--) {
      var dt = new Date(todayMs - j * DAY);
      var key = isoDate(dt);
      var entry = byDay[key];
      var n = entry ? entry.total : 0;
      var level = n === 0 ? 0 : (n < 5 ? 1 : n < 15 ? 2 : n < 40 ? 3 : 4);
      cells.push({ key: key, n: n, level: level, dow: dt.getDay() });
    }
    // Pad the start so the first cell aligns to its weekday row
    var leadPad = cells[0].dow;
    var pads = [];
    for (var p = 0; p < leadPad; p++) {
      pads.push({ key: null, n: 0, level: 0, empty: true });
    }
    var allCells = pads.concat(cells);

    var totalLast30 = 0;
    Object.keys(byDay).forEach(function (k) {
      var t = new Date(k + 'T12:00:00').getTime();
      if (t >= thirtyAgo) totalLast30 += byDay[k].total;
    });

    var html = '<div class="view-header">'
             + '<span class="eyebrow">Practice</span>'
             + '<h2>Your last 90 days</h2>'
             + '<p class="lede">Practice logged, ratings given, days in a row.</p>'
             + '</div>'
             + '<div class="stat-grid">'
               + '<div class="stat"><div class="num">' + rows.length + '</div><div class="lbl">Times Practiced</div></div>'
               + '<div class="stat"><div class="num">' + totalLast30 + '</div><div class="lbl">Last 30 days</div></div>'
               + '<div class="stat"><div class="num">' + streak + '</div><div class="lbl">Day streak</div></div>'
               + '<div class="stat"><div class="num">' + (retention === null ? '—' : retention + '%') + '</div><div class="lbl">Retention</div></div>'
             + '</div>'
             + '<p class="mini-legend"><strong>Retention</strong> = how often you recalled a card correctly when it came back. <strong>Day streak</strong> = days in a row you have practiced.</p>'
             + (function () {
                 // Freeze card: if you cannot practice today (sick, travel),
                 // burn a freeze to preserve the streak. One per 7 days.
                 var label, disabled;
                 if (freezeAlreadyAppliedToday) {
                   label = 'Freeze active today';
                   disabled = true;
                 } else if (freezeAvailable) {
                   label = 'Use a freeze';
                   disabled = false;
                 } else {
                   var daysLeft = Math.max(1, Math.ceil((freezeReadyAt - Date.now()) / DAY));
                   label = 'Next freeze in ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's');
                   disabled = true;
                 }
                 return '<div class="freeze-card">'
                      + '<div class="freeze-text">'
                      + '<strong>Streak freeze.</strong> If you cannot practice today (sick, travelling), use a freeze to keep your streak alive. One available every 7 days.'
                      + '</div>'
                      + '<button type="button" id="useFreezeBtn"' + (disabled ? ' disabled' : '') + '>' + escapeHtml(label) + '</button>'
                      + '</div>';
               })()
             + '<div class="heatmap">'
               + '<h3>Activity heatmap (90 days)</h3>'
               + '<div class="heatmap-grid">';
    allCells.forEach(function (c) {
      if (c.empty) {
        html += '<div class="heatmap-cell" data-level="0" style="visibility:hidden"></div>';
      } else {
        var title = c.key + ': ' + c.n + ' practiced';
        html += '<div class="heatmap-cell" data-level="' + c.level + '" title="' + escapeHtml(title) + '"></div>';
      }
    });
    html += '</div>'
            + '<div class="heatmap-legend">'
              + '<span>Less</span>'
              + '<span class="swatch" style="background:var(--cream)"></span>'
              + '<span class="swatch" style="background:#ddd0bd"></span>'
              + '<span class="swatch" style="background:#b89a7a"></span>'
              + '<span class="swatch" style="background:#8a6442"></span>'
              + '<span class="swatch" style="background:var(--burgundy)"></span>'
              + '<span>More</span>'
            + '</div>'
          + '</div>';

    if (ret_total > 0) {
      html += '<div style="font-family:\'Cinzel\',serif;font-size:0.66rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--taupe-dark);margin:18px 0 10px">Last 30 days · rating breakdown</div>'
            + '<div class="rating-breakdown">'
              + '<div class="rb rb-1"><div class="num">' + rb[1] + '</div><div class="lbl">Again</div></div>'
              + '<div class="rb rb-2"><div class="num">' + rb[2] + '</div><div class="lbl">Hard</div></div>'
              + '<div class="rb rb-3"><div class="num">' + rb[3] + '</div><div class="lbl">Good</div></div>'
              + '<div class="rb rb-4"><div class="num">' + rb[4] + '</div><div class="lbl">Easy</div></div>'
            + '</div>';
    }

    main.innerHTML = html;

    // Wire the freeze button if present and enabled.
    var freezeBtn = document.getElementById('useFreezeBtn');
    if (freezeBtn && !freezeBtn.disabled) {
      freezeBtn.addEventListener('click', function () {
        try {
          var arr = JSON.parse(localStorage.getItem('tlm_freezes_used') || '[]');
          if (arr.indexOf(todayKey) === -1) arr.push(todayKey);
          localStorage.setItem('tlm_freezes_used', JSON.stringify(arr));
          localStorage.setItem('tlm_last_freeze_at', String(Date.now()));
        } catch (_) {}
        // Re-render so the streak count, button state, and label refresh.
        showStats();
      });
    }
  }

  // ─── Daily target stats ─────────────────────────────────────────────────
  // Computed from local USER_STATE so we don't fire another network round
  // trip for the showDone celebration / Calendar banner / progress bar.
  function getTodayStats() {
    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    var todayMs = todayStart.getTime();
    var nowMs = Date.now();
    var reviewedToday = 0, newIntroducedToday = 0, dueNow = 0;
    Object.keys(USER_STATE).forEach(function (cid) {
      var s = USER_STATE[cid];
      if (!s.last_review) return;
      var lr = new Date(s.last_review).getTime();
      if (lr >= todayMs) {
        reviewedToday++;
        // reps==1 with last_review=today is a card that became "in rotation"
        // today, i.e. introduced. Approximation -- holds unless undo path
        // walked it back to reps=0 then back up to 1, which is rare.
        if (s.reps === 1) newIntroducedToday++;
      }
    });
    if (STATIC && STATIC.cards) {
      STATIC.cards.forEach(function (c) {
        var s = USER_STATE[c.id];
        if (!s || !s.due || s.reps <= 0) return;
        if (new Date(s.due).getTime() <= nowMs) dueNow++;
      });
    }
    // Extra (today-only override) is purely additive on top of whatever
    // base remains. If you've already overshot the daily target the base
    // remainder is 0; extra still grants its full slot count anyway.
    var baseRemaining = Math.max(0, getDailyTarget() - newIntroducedToday);
    var newRemaining = baseRemaining + getExtraToday();
    var maxCap = getMaxPerDay() + getExtraToday();
    // todayGoal = the single canonical denominator used by the banner,
    // the in-card progress strip, and the calendar today-row. Caps at
    // MAX (plus extra), but never falls below what you've already done.
    var available = reviewedToday + dueNow + newRemaining;
    var todayGoal = Math.max(reviewedToday, Math.min(maxCap, available));
    var totalGoal = Math.max(0, todayGoal - reviewedToday);
    return {
      reviewedToday: reviewedToday,
      newIntroducedToday: newIntroducedToday,
      newRemaining: newRemaining,
      dueNow: dueNow,
      totalGoal: totalGoal,
      todayGoal: todayGoal,
      maxCap: maxCap,
    };
  }

  // ─── Date utils for calendar/stats ──────────────────────────────────────
  function isoDate(d) {
    var yr = d.getFullYear();
    var mo = String(d.getMonth() + 1).padStart(2, '0');
    var da = String(d.getDate()).padStart(2, '0');
    return yr + '-' + mo + '-' + da;
  }
  function weekday(d) {
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
  }
  function monthDay(d) {
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  function showProfileMsg(el, text, kind) {

  // ─── Leaderboard view ───────────────────────────────────────────────────
  // Shows every user in the signed-in user's archdiocese, ranked by the
  // active metric (cards seen by default, switchable to total reviews or
  // mature cards). Privacy: display_name is computed server-side as
  // 'First L.' so we never ship full names over the wire.

  var LB_METRIC = 'cards_seen'; // cards_seen | total_reviews | cards_mature

  function showLeaderboard() {
    setActiveView('leaderboard');
    if (!profileIsComplete(PROFILE)) {
      showProfileSetup({ reason: 'leaderboard' });
      return;
    }
    var main = document.getElementById('main');
    main.innerHTML = '<div class="status-msg">Loading leaderboard…</div>';
    rest('/leaderboard?select=user_id,display_name,country,archdiocese,cards_seen,cards_mature,total_reviews,total_lapses,last_review_at&archdiocese=eq.' + encodeURIComponent(PROFILE.archdiocese) + '&order=' + LB_METRIC + '.desc&limit=200', SESSION)
      .then(function (rows) {
        renderLeaderboard(rows || []);
      })
      .catch(function (err) {
        showErr('Failed to load leaderboard: ' + (err.message || err));
      });
  }

  function renderLeaderboard(rows) {
    var main = document.getElementById('main');
    var metricLabels = {
      cards_seen: 'Words Seen',
      total_reviews: 'Times Practiced',
      cards_mature: 'Words Mastered',
    };
    var metric = LB_METRIC;
    var myIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].user_id === SESSION.user.id) { myIdx = i; break; }
    }

    var header = '<div class="view-header">'
               + '<span class="eyebrow">Leaderboard</span>'
               + '<h2>' + escapeHtml(PROFILE.archdiocese) + '</h2>'
               + '<p class="lede">' + rows.length + (rows.length === 1 ? ' faithful' : ' faithful') + ' from the Archdiocese of ' + escapeHtml(PROFILE.archdiocese) + '. Rankings refresh as people study.</p>'
               + '</div>';

    var tabs = '<div class="lb-tabs">'
             + '<button type="button" class="lb-tab' + (metric === 'cards_seen' ? ' active' : '') + '" data-metric="cards_seen">Seen</button>'

             + '<button type="button" class="lb-tab' + (metric === 'cards_mature' ? ' active' : '') + '" data-metric="cards_mature">Mastered</button>'
             + '</div>';

        + '<div class="lb-empty">No one from your archdiocese has started studying yet. Share the app with your parish to fill out the board.</div>';

    var medals = ['', '\u{1F947}', '\u{1F948}', '\u{1F949}'];
    var listHtml = rows.map(function (r, idx) {

      return '<div class="lb-row' + (isMe ? ' you' : '') + '">'
           + '<div class="lb-rank">' + rankDisplay + '</div>'
           + '<div>'
             + '<div class="lb-name">' + escapeHtml(r.display_name || 'Anonymous') + (isMe ? '<span class="you-tag">you</span>' : '') + '</div>'
             + (subBits.length ? '<div class="lb-sub">' + escapeHtml(subBits.join(' · ')) + '</div>' : '')
           + '</div>'
           + '<div class="lb-metric">'

    }).join('');

    main.innerHTML = header + tabs + '<div class="leaderboard-list">' + listHtml + '</div>';

  function wireLbTabs() {
    document.querySelectorAll('.lb-tab[data-metric]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        LB_METRIC = btn.dataset.metric;
        showLeaderboard();

  // ─── Review session ─────────────────────────────────────────────────────
  function startDeck(deckId) {
    ACTIVE_DECK = STATIC.decks.find(function (d) { return d.id === deckId; });
    SESSION_REVIEWS = 0;
    HISTORY = [];
    buildQueue();
    nextCard();
  }

  function buildQueue() {
    // Queue rule: total queue size capped at MAX_PER_DAY (minus what's
    // already done today). Due reviews take priority (oldest first); new
    // cards (most-frequent-in-the-Mass first) fill whatever budget remains
    // up to NEW_PER_DAY. Both caps are global across decks.
    var now = Date.now();
    var due = [];
    var fresh = [];
    var cards = STATIC.cardsByDeck[ACTIVE_DECK.id] || [];
    cards.forEach(function (c) {
      var s = USER_STATE[c.id];
      if (!s) {
        fresh.push(c);
      } else if (s.reps > 0) {
        var dueMs = new Date(s.due).getTime();
        if (dueMs <= now) due.push({ card: c, dueMs: dueMs });
      }
    });
    due.sort(function (a, b) { return a.dueMs - b.dueMs; });
    var stats = getTodayStats();
    var budget = Math.max(0, stats.maxCap - stats.reviewedToday);
    var dueSlots = Math.min(due.length, budget);
    var queuedDue = due.slice(0, dueSlots).map(function (e) { return e.card; });
    var newSlots = Math.max(0, Math.min(stats.newRemaining, budget - dueSlots));
    QUEUE = queuedDue.concat(fresh.slice(0, newSlots));
  }

  function nextCard() {
    if (QUEUE.length === 0) {
      showDone();
      return;
    }
    CURRENT = QUEUE.shift();
    CURRENT_FLIPPED = false;
    IMAGE_PEEKED = false;
    REVIEW_START = Date.now();
    renderCard();
  }

  function renderCard() {
    var note = STATIC.notesById[CURRENT.note_id];
    // We only ship Latin -> English now. Always show Latin as the prompt
    // and English as the small interlinear gloss revealed on flip.
    var latin = note.latin;
    var english = note.english;

    var posLine = '';
    if (note.note_type === 'vocab' && note.pos) {
      posLine = '<span class="pos">' + escapeHtml(note.pos) + '</span>'
              + (note.lemma ? escapeHtml(note.lemma) : '');
    } else if (note.note_type === 'phrase_pair' && note.role) {
      posLine = '<span class="role">' + escapeHtml(formatRole(note.role)) + '</span>';
    }

    // Forms block. Multi-form notes carry an authored forms_detail array
    // (one plain-English gloss per inflected form, because "manibus" does
    // NOT mean the same as "manus"). Single-form notes fall back to the
    // dictionary English, which is correct for the lemma form.
    var formsLine = '';
    var fdetail = note.forms_detail;
    if (fdetail && fdetail.length) {
      var formChips = fdetail.map(function (f) {
        return '<div class="form-chip">'
          + '<span class="form-en">' + escapeHtml(f.g || '') + '</span>'
          + '<span class="form-lat">' + escapeHtml(f.f)
            + (f.n != null ? '<span class="form-ct">(' + escapeHtml(String(f.n)) + ')</span>' : '')
          + '</span>'
          + '</div>';
      }).join('');
      var primerOpen = false;
      try { primerOpen = localStorage.getItem('tlm_forms_primer') === 'open'; } catch (_) {}
      formsLine = '<div class="forms">'
        + '<div class="forms-label">how each form is used · (count) = times in the Mass</div>'
        + '<div class="forms-chips">' + formChips + '</div>'
        + '<button type="button" class="forms-primer-toggle" id="formsPrimerBtn" aria-expanded="'
          + (primerOpen ? 'true' : 'false') + '">'
          + (primerOpen ? 'Hide explanation' : 'Why do the spellings change?')
        + '</button>'
        + '<div class="forms-primer" id="formsPrimer"' + (primerOpen ? '' : ' hidden') + '>'
          + 'Latin changes a word’s ending to show its job in the sentence: '
          + 'whether it is the subject or the object, whether it means '
          + '“of”, “to/for” or “by/with” something, and whether '
          + 'it is one or many. The red line above each form is what that exact '
          + 'spelling means in English.'
        + '</div>'
        + '</div>';
    } else if (note.forms_summary) {
      var formChips2 = note.forms_summary.split(' | ').map(function (f) {
        var m = f.match(/^(.+?)\((\d+)\)$/);
        var formText = m ? m[1] : f;
        var countText = m ? '(' + m[2] + ')' : '';
        return '<div class="form-chip">'
          + '<span class="form-en">' + escapeHtml(note.english || '') + '</span>'
          + '<span class="form-lat">' + escapeHtml(formText)
            + (countText ? '<span class="form-ct">' + escapeHtml(countText) + '</span>' : '')
          + '</span>'
          + '</div>';
      }).join('');
      formsLine = '<div class="forms">'
        + '<div class="forms-label">times this word appears in the Mass</div>'
        + '<div class="forms-chips">' + formChips2 + '</div>'
        + '</div>';
    }

    var prayerLine = '';
    if (note.prayer_id) {
      var prayer = STATIC.prayers.find(function (p) { return p.id === note.prayer_id; });
      if (prayer) prayerLine = '<div class="role">' + escapeHtml(prayer.name) + '</div>';
    }

    // Per-note teaching gloss. For words where a usage convention matters
    // (capitalisation, ecclesiastical vs classical sense, false friends, etc.)
    // we keep a one-paragraph explanation in static.json's notes field.
    var notesLine = '';
    if (note.notes && CURRENT_FLIPPED) {
      notesLine = '<div class="card-note">' + escapeHtml(note.notes) + '</div>';
    }

    // Image is shown either when the user has chosen to peek (pre-flip cue,
    // their call) or always on the back. When neither, but an image exists,
    // we render a small "View image" hint button instead so the user can
    // opt-in to a clue without forcing it.
    var hasImage = !!note.image_path && SETTINGS.show_images;
    var showImage = hasImage && (CURRENT_FLIPPED || IMAGE_PEEKED);
    var imageBlock = '';
    if (showImage) {
      imageBlock = '<div class="card-image"><img src="' + escapeHtml(note.image_path)
                 + '" alt="" loading="lazy" decoding="async"></div>';
    }
    var peekBlock = '';
    if (hasImage && !CURRENT_FLIPPED && !IMAGE_PEEKED) {
      peekBlock = '<button id="peekBtn" class="peek-btn" type="button" aria-label="View image hint">'
                + '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">'
                  + '<path fill="currentColor" d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z"/>'
                + '</svg>'
                + '<span>View image</span>'
                + '</button>';
    }
    var audioBlock = '';
    if (note.audio_path && CURRENT_FLIPPED && SETTINGS.play_audio) {
      audioBlock = '<div class="card-audio">'
                 + '<button id="replayBtn" class="audio-btn" type="button" aria-label="Play Latin audio">'
                   + '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">'
                     + '<path fill="currentColor" d="M8 5v14l11-7z"/>'
                   + '</svg>'
                   + '<span>Latin</span>'
                 + '</button>'
                 + '<audio id="cardAudio" preload="auto" src="' + escapeHtml(note.audio_path) + '"></audio>'
                 + '</div>';
    }

    // Interlinear English gloss: small, red, italic, sits ABOVE the Latin
    // — the same convention as a hand-missal interlinear translation.
    var interlinearBlock = CURRENT_FLIPPED
      ? '<div class="interlinear">' + escapeHtml(english) + '</div>'
      : '';

    var canUndo = HISTORY.length > 0;
    var ts = getTodayStats();
    var goalDone = ts.reviewedToday;
    var goalTotal = ts.todayGoal;
    var goalPct = goalTotal > 0 ? Math.min(100, Math.round(100 * goalDone / goalTotal)) : 0;
    var goalLabel;
    if (goalTotal === 0) {
      goalLabel = 'Bonus round';
    } else if (goalDone >= goalTotal) {
      goalLabel = 'Today\'s goal complete · ' + goalDone + ' done';
    } else {
      goalLabel = goalDone + ' / ' + goalTotal + ' today';
    }
    var cardState = USER_STATE[CURRENT.id];
    var stateLabel, stateClass;
    if (!cardState || cardState.state === 0)      { stateLabel = 'new';      stateClass = 'cs-new'; }
    else if (cardState.state === 1 || cardState.state === 3) { stateLabel = 'learning'; stateClass = 'cs-learning'; }
    else                                          { stateLabel = 'review';   stateClass = 'cs-review'; }
    var statePillHtml = '<span class="card-state-pill ' + stateClass + '">' + stateLabel + '</span>';

    var html = '<div class="card-section">'
            + '<div class="progress">'
              + '<button id="backBtn">← Back to decks</button>'
              + '<span class="prog-mid">' + escapeHtml(ACTIVE_DECK.name) + statePillHtml + '</span>'
              + '<button id="prevBtn" class="prev-btn"' + (canUndo ? '' : ' disabled aria-disabled="true"') + ' title="' + (canUndo ? 'Previous card (undo last rating)' : 'No previous card to go back to') + '">← Previous</button>'
            + '</div>'
            + '<div class="card-goal">'
              + '<div class="card-goal-row"><span>' + escapeHtml(goalLabel) + '</span>'
              + (goalDone >= goalTotal && goalTotal > 0 ? '<span class="card-goal-badge">✓</span>' : '')
              + '</div>'
              + '<div class="card-goal-bar"><span class="card-goal-bar-fill" style="width:' + goalPct + '%"></span></div>'
            + '</div>'
            + '<div class="card" id="cardEl">'
              // Pre-flip: just the Latin prompt. Post-flip: image (memory
              // reinforcement, not a recall hint) above the interlinear English
              // gloss above the Latin prompt, with audio + meta below.
              + imageBlock
              + interlinearBlock
              + '<div class="front">' + escapeHtml(latin) + '</div>'
              + (CURRENT_FLIPPED ?
                  '<div class="back">'
                    + audioBlock
                    + (posLine ? '<div class="meta">' + posLine + '</div>' : '')
                    + formsLine
                    + notesLine
                    + prayerLine
                  + '</div>'
                : '')
            + '</div>';
    if (!CURRENT_FLIPPED) {
      if (peekBlock) html += '<div class="peek-row">' + peekBlock + '</div>';
      html += '<button class="reveal-btn" id="revealBtn">Show answer</button>';
    } else {
      var prevState = USER_STATE[CURRENT.id];
      var hint = scheduleHints(prevState);
      html += '<p class="rating-help">'
            + 'Rate how easily you recalled it. <strong>Again</strong> repeats in minutes. '
            + '<strong>Good</strong> and <strong>Easy</strong> schedule days or weeks out based on your history. '
            + 'The harder it felt, the sooner it comes back.'
            + '</p>'
            + '<div class="rate-row">'
            + '<button class="rate-btn" data-rating="1">Again<span class="interval-hint">' + hint[1] + '</span></button>'
            + '<button class="rate-btn" data-rating="2">Hard<span class="interval-hint">' + hint[2] + '</span></button>'
            + '<button class="rate-btn" data-rating="3">Good<span class="interval-hint">' + hint[3] + '</span></button>'
            + '<button class="rate-btn" data-rating="4">Easy<span class="interval-hint">' + hint[4] + '</span></button>'
            + '</div>'
            + '<button id="unflipBtn" class="unflip-btn" type="button">↑ Hide answer</button>';
    }
    html += '</div>';
    document.getElementById('main').innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', showDeckPicker);
    var prevBtn = document.getElementById('prevBtn');
    if (prevBtn) {
      prevBtn.addEventListener('click', function (e) {
        if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
        if (HISTORY.length === 0) return;
        goPrevious();
      });
    }
    if (!CURRENT_FLIPPED) {
      document.getElementById('revealBtn').addEventListener('click', flip);
      // Tapping the card area flips, but we don't want a tap on the peek
      // button to also flip — stop propagation in the peek handler below.
      document.getElementById('cardEl').addEventListener('click', flip);
      var peekBtn = document.getElementById('peekBtn');
      if (peekBtn) {
        peekBtn.addEventListener('click', function (e) {
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          IMAGE_PEEKED = true;
          renderCard();
        });
      }
    } else {
      document.querySelectorAll('.rate-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { rate(parseInt(btn.dataset.rating, 10)); });
      });
      var unflipBtn = document.getElementById('unflipBtn');
      if (unflipBtn) unflipBtn.addEventListener('click', unflip);
      // Auto-play the Latin audio on flip. The flip itself was a user gesture
      // (tap on cardEl or revealBtn), so iOS Safari's autoplay block doesn't
      // bite us. If the user taps the replay button, we restart from zero.
      var audioEl = document.getElementById('cardAudio');
      var replayBtn = document.getElementById('replayBtn');
      if (audioEl) {
        var p = audioEl.play();
        if (p && typeof p.catch === 'function') p.catch(function () { /* user can replay */ });
      }
      if (replayBtn && audioEl) {
        replayBtn.addEventListener('click', function () {
          audioEl.currentTime = 0;
          var pp = audioEl.play();
          if (pp && typeof pp.catch === 'function') pp.catch(function () {});
        });
      }
      // Forms primer: toggle the "why do spellings change?" explainer and
      // remember the choice so it neither nags nor resets every card.
      var primerBtn = document.getElementById('formsPrimerBtn');
      var primerBox = document.getElementById('formsPrimer');
      if (primerBtn && primerBox) {
        primerBtn.addEventListener('click', function () {
          var open = primerBox.hasAttribute('hidden');
          if (open) {
            primerBox.removeAttribute('hidden');
            primerBtn.textContent = 'Hide explanation';
            primerBtn.setAttribute('aria-expanded', 'true');
          } else {
            primerBox.setAttribute('hidden', '');
            primerBtn.textContent = 'Why do the spellings change?';
            primerBtn.setAttribute('aria-expanded', 'false');
          }
          try { localStorage.setItem('tlm_forms_primer', open ? 'open' : 'closed'); } catch (_) {}
        });
      }
    }
    // First-time visitor: show a 3-step explainer overlay, once.
    maybeShowOnboardingTour();
  }

  // ─── First-time onboarding tour ─────────────────────────────────────
  // Three-step overlay shown on the very first card a new user sees.
  // Marker in localStorage prevents re-showing. Stays out of the way of
  // returning users entirely. Tour content is plain-language and matches
  // the post-v40 vocab (practice, root words, spaced practice).
  var TOUR_STEPS = [
    {
      eyebrow: 'Welcome',
      title: 'Tap the card to reveal the English',
      body: 'The Latin is on the front. Tap anywhere on the card, or press the Reveal button, and the English translation appears above it in red italic, the way a hand-missal lays out a bilingual translation.'
    },
    {
      eyebrow: 'Step 2',
      title: 'Rate how easily you recalled it',
      body: 'After the reveal, four buttons appear: Again, Hard, Good, Easy. The small number under each shows when the card will come back if you tap that button. The harder it felt, the sooner it comes back.'
    },
    {
      eyebrow: 'Step 3',
      title: 'Come back daily. Five to ten minutes is enough',
      body: 'Each word is scheduled to come back just before you would forget it. Skip a day and it bunches up; keep a short daily rhythm and it sticks for the long term. That is the entire method.'
    }
  ];
  function maybeShowOnboardingTour() {
    try {
      if (localStorage.getItem('tlm_onboarded') === '1') return;
    } catch (_) { /* private mode etc: just skip */ return; }
    if (document.querySelector('.tour-overlay')) return; // already showing
    showOnboardingStep(0);
  }
  function showOnboardingStep(i) {
    var step = TOUR_STEPS[i];
    if (!step) return finishOnboardingTour();
    var existing = document.querySelector('.tour-overlay');
    if (existing) existing.remove();
    var ov = document.createElement('div');
    ov.className = 'tour-overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-labelledby', 'tourTitle');
    var last = i === TOUR_STEPS.length - 1;
    ov.innerHTML =
        '<div class="tour-card">'
      +   '<span class="eyebrow">' + escapeHtml(step.eyebrow) + '</span>'
      +   '<h3 id="tourTitle">' + escapeHtml(step.title) + '</h3>'
      +   '<p>' + escapeHtml(step.body) + '</p>'
      +   '<div class="tour-actions">'
      +     '<button type="button" class="tour-skip" id="tourSkip">Skip</button>'
      +     '<button type="button" id="tourNext">' + (last ? 'Start studying' : 'Next') + '</button>'
      +   '</div>'
      +   '<div class="tour-progress">' + (i + 1) + ' of ' + TOUR_STEPS.length + '</div>'
      + '</div>';
    document.body.appendChild(ov);
    document.getElementById('tourNext').addEventListener('click', function () {
      if (last) finishOnboardingTour(); else showOnboardingStep(i + 1);
    });
    document.getElementById('tourSkip').addEventListener('click', finishOnboardingTour);
  }
  function finishOnboardingTour() {
    var ov = document.querySelector('.tour-overlay');
    if (ov) ov.remove();
    try { localStorage.setItem('tlm_onboarded', '1'); } catch (_) {}
  }

  function flip() {
    CURRENT_FLIPPED = true;
    renderCard();
  }

  // ─── FSRS-4.5 scheduling ────────────────────────────────────────────────
  // Default open-source weights from the FSRS reference implementation.
  // These can be optimised per-user later from accumulated user_review_log.
  var FSRS_W = [
    0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651,
    0.0234, 1.616, 0.1544, 1.0824, 1.9813, 0.0953, 0.2975,
    2.2042, 0.2407, 2.9466, 0.5034, 0.6567
  ];
  var FSRS_REQUEST_RETENTION = 0.9;
  var FSRS_DECAY = -0.5;
  // FACTOR = 19/81 ≈ 0.2346, derived so that R(t=S, S) = 0.9 exactly
  var FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;
  var FSRS_MAX_INTERVAL = 365 * 5; // cap at 5 years

  function fsrsClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function fsrsInitDifficulty(rating) {
    return fsrsClamp(FSRS_W[4] - (rating - 3) * FSRS_W[5], 1, 10);
  }

  function fsrsInitStability(rating) {
    return Math.max(FSRS_W[rating - 1], 0.1);
  }

  function fsrsNextDifficulty(D, rating) {
    var next = D - FSRS_W[6] * (rating - 3);
    var dInit = fsrsInitDifficulty(3);
    return fsrsClamp(FSRS_W[7] * dInit + (1 - FSRS_W[7]) * next, 1, 10);
  }

  function fsrsRetrievability(elapsedDays, S) {
    return Math.pow(1 + FSRS_FACTOR * elapsedDays / Math.max(S, 0.1), FSRS_DECAY);
  }

  function fsrsNextRecallStability(D, S, R, rating) {
    var hardPenalty = rating === 2 ? FSRS_W[15] : 1;
    var easyBonus = rating === 4 ? FSRS_W[16] : 1;
    return S * (1 + Math.exp(FSRS_W[8])
                * (11 - D)
                * Math.pow(S, -FSRS_W[9])
                * (Math.exp(FSRS_W[10] * (1 - R)) - 1)
                * hardPenalty
                * easyBonus);
  }

  function fsrsNextForgetStability(D, S, R) {
    return FSRS_W[11]
      * Math.pow(D, -FSRS_W[12])
      * (Math.pow(S + 1, FSRS_W[13]) - 1)
      * Math.exp(FSRS_W[14] * (1 - R));
  }

  function fsrsNextInterval(S) {
    var ivl = (S / FSRS_FACTOR) * (Math.pow(FSRS_REQUEST_RETENTION, 1 / FSRS_DECAY) - 1);
    return fsrsClamp(Math.round(ivl), 1, FSRS_MAX_INTERVAL);
  }

  // Anki-style fuzz factor. Cards introduced together would collapse onto
  // the exact same future day without it, producing pile-ups. Spreads
  // similar-interval cards across a small range so the daily review load
  // is naturally smooth -- without ever reviewing a card later than
  // FSRS-optimal by enough to dent retention. Ratios match the open-source
  // FSRS-Anki Rust implementation.
  function fsrsFuzzInterval(days) {
    if (days < 3) return days; // 1-2 day intervals: no fuzz, already minimum
    var ratio;
    if (days < 7) ratio = 0.15;
    else if (days < 30) ratio = 0.08;
    else if (days < 365) ratio = 0.04;
    else ratio = 0.02;
    var min = Math.max(1, Math.round(days * (1 - ratio)));
    var max = Math.max(min, Math.round(days * (1 + ratio)));
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  // Anki-style learning step result for new cards and same-day re-reviews
  // of learning/relearning cards. FSRS math correctly says R≈1 means
  // ~zero stability growth on same-day reviews, but that collapses Hard /
  // Good / Easy to identical 1-day intervals after the floor clamp, which
  // is confusing UX. Steps make the four buttons mean four different things:
  //
  //   Again -> 1m, stay in learning
  //   Hard  -> 6m, stay in learning
  //   Good  -> graduate to review with rating-3 init stability (~3 days)
  //   Easy  -> graduate to review with rating-4 init stability (~15 days)
  //
  // Once a card has graduated AND a real day has elapsed, the FSRS path
  // takes over (recall stability formula with proper R from elapsed time).
  function learningStepResult(prev, rating, now, applyFuzz) {
    applyFuzz = applyFuzz !== false;
    var prevReps = prev ? (prev.reps || 0) : 0;
    var prevLapses = prev ? (prev.lapses || 0) : 0;
    var prevS = prev ? (prev.stability || 0) : 0;
    var prevD = prev ? (prev.difficulty || 0) : 0;

    var newReps = prevReps + 1;
    var newLapses = prevLapses;
    var newS, newD, newDays, newState, newDue;

    if (rating === 1) {
      newD = prev && prevD > 0 ? fsrsNextDifficulty(prevD, 1) : fsrsInitDifficulty(1);
      newS = prev && prevS > 0 ? prevS : fsrsInitStability(1);
      if (prevReps > 0) newLapses = prevLapses + 1;
      newState = 1;
      newDays = 0;
      newDue = new Date(now.getTime() + 60 * 1000);
    } else if (rating === 2) {
      newD = prev && prevD > 0 ? fsrsNextDifficulty(prevD, 2) : fsrsInitDifficulty(2);
      newS = prev && prevS > 0 ? prevS : fsrsInitStability(2);
      newState = 1;
      newDays = 0;
      newDue = new Date(now.getTime() + 6 * 60 * 1000);
    } else if (rating === 3) {
      newD = prev && prevD > 0 ? fsrsNextDifficulty(prevD, 3) : fsrsInitDifficulty(3);
      newS = fsrsInitStability(3);
      newState = 2;
      newDays = fsrsNextInterval(newS);
      if (applyFuzz) newDays = fsrsFuzzInterval(newDays);
      newDue = new Date(now.getTime() + newDays * 86400000);
    } else {
      newD = prev && prevD > 0 ? fsrsNextDifficulty(prevD, 4) : fsrsInitDifficulty(4);
      newS = fsrsInitStability(4);
      newState = 2;
      newDays = fsrsNextInterval(newS);
      if (applyFuzz) newDays = fsrsFuzzInterval(newDays);
      newDue = new Date(now.getTime() + newDays * 86400000);
    }

    return {
      due: newDue.toISOString(),
      scheduled_days: newDays,
      elapsed_days: 0,
      stability: Number(newS.toFixed(4)),
      difficulty: Number(newD.toFixed(4)),
      reps: newReps,
      lapses: newLapses,
      state: newState,
      last_review: now.toISOString(),
    };
  }

  // Compute new card state after a review with the given rating (1..4).
  // Returns the row to upsert into user_card_state. Pass applyFuzz=false
  // from scheduleHints() so the preview intervals don't jitter between
  // renders; pass true (default) from rate() so the actual scheduled day
  // gets a ±5–15% random adjustment to prevent pile-ups.
  function nextSchedule(prev, rating, applyFuzz) {
    applyFuzz = applyFuzz !== false;
    var now = new Date();
    var prevReps = prev ? (prev.reps || 0) : 0;
    var prevLapses = prev ? (prev.lapses || 0) : 0;
    var prevState = prev ? (prev.state || 0) : 0;
    var prevS = prev ? (prev.stability || 0) : 0;
    var prevD = prev ? (prev.difficulty || 0) : 0;
    var prevReview = prev && prev.last_review ? new Date(prev.last_review).getTime() : 0;
    var elapsedDays = prevReview ? Math.max(0, (now.getTime() - prevReview) / 86400000) : 0;
    var sameDay = prevReview > 0 && elapsedDays < 0.5;

    // Use learning steps for: new cards, same-day re-reviews of learning
    // (state=1) or relearning (state=3) cards. Graduated cards (state=2)
    // hit the standard FSRS path even on same-day reviews — but the buildQueue
    // logic shouldn't normally show them same-day anyway.
    if (prevReps === 0 || (sameDay && (prevState === 1 || prevState === 3))) {
      return learningStepResult(prev, rating, now, applyFuzz);
    }

    var newS, newD, newDays, newDue, newState;
    var newReps = prevReps + 1;
    var newLapses = prevLapses;

    // Subsequent review of a graduated card (or any non-same-day review).
    var R = fsrsRetrievability(elapsedDays, prevS);
    newD = fsrsNextDifficulty(prevD || fsrsInitDifficulty(3), rating);
    if (rating === 1) {
      // Lapse — back into relearning
      newS = fsrsNextForgetStability(newD, prevS || 0.1, R);
      newLapses = prevLapses + 1;
      newState = 3;
      newDays = 0;
      newDue = new Date(now.getTime() + 10 * 60 * 1000);
    } else {
      newS = fsrsNextRecallStability(newD, prevS || 0.1, R, rating);
      newState = 2;
      newDays = fsrsNextInterval(newS);
      if (applyFuzz) newDays = fsrsFuzzInterval(newDays);
      newDue = new Date(now.getTime() + newDays * 86400000);
    }

    return {
      due: newDue.toISOString(),
      scheduled_days: newDays,
      elapsed_days: Math.round(elapsedDays),
      stability: Number(newS.toFixed(4)),
      difficulty: Number(newD.toFixed(4)),
      reps: newReps,
      lapses: newLapses,
      state: newState,
      last_review: now.toISOString(),
    };
  }

  // What interval will each rating button produce? Reads the actual schedule
  // (so changes to nextSchedule auto-flow into the hints) and formats the
  // result in minutes / hours / days as appropriate. Fuzz is disabled here
  // so the previewed interval matches what the user expects from FSRS;
  // the actual rated card gets fuzz applied when rate() commits it.
  function scheduleHints(prev) {
    var hints = {};
    var nowMs = Date.now();
    for (var rating = 1; rating <= 4; rating++) {
      var sim = nextSchedule(prev, rating, false);
      if (sim.scheduled_days >= 1) {
        hints[rating] = humanInterval(sim.scheduled_days);
      } else {
        // Sub-day interval (learning step). Show minutes/hours from due.
        var diffMin = Math.max(0, Math.round((new Date(sim.due).getTime() - nowMs) / 60000));
        if (diffMin < 1) hints[rating] = '<1m';
        else if (diffMin < 60) hints[rating] = diffMin + 'm';
        else hints[rating] = Math.round(diffMin / 60) + 'h';
      }
    }
    return hints;
  }

  function humanInterval(days) {
    if (days < 1) return '<1d';
    if (days < 30) return days + 'd';
    if (days < 365) return Math.round(days / 30) + 'mo';
    return (days / 365).toFixed(1) + 'y';
  }

  function rate(rating) {
    var prev = USER_STATE[CURRENT.id];
    var nextState = nextSchedule(prev, rating);
    var elapsedDays = prev && prev.last_review
      ? Math.max(0, Math.round((Date.now() - new Date(prev.last_review).getTime()) / 86400000))
      : 0;

    // Snapshot the pre-rate state into HISTORY so "Previous" can restore it.
    // We deep-copy prev (or null if this was a brand-new card) so subsequent
    // mutations of USER_STATE don't bleed into the snapshot.
    HISTORY.push({
      card: CURRENT,
      prevState: prev ? JSON.parse(JSON.stringify(prev)) : null,
    });
    if (HISTORY.length > HISTORY_MAX) HISTORY.shift();

    // optimistic local update
    USER_STATE[CURRENT.id] = {
      card_id: CURRENT.id,
      due: nextState.due,
      stability: nextState.stability,
      difficulty: nextState.difficulty,
      reps: nextState.reps,
      lapses: nextState.lapses,
      state: nextState.state,
      last_review: nextState.last_review,
      scheduled_days: nextState.scheduled_days,
    };

    var userId = SESSION.user.id;
    var upsert = Object.assign({ user_id: userId, card_id: CURRENT.id, updated_at: nextState.last_review }, nextState);
    var logEntry = {
      user_id: userId,
      card_id: CURRENT.id,
      rating: rating,
      review_time: nextState.last_review,
      scheduled_days: nextState.scheduled_days,
      elapsed_days: elapsedDays,
      state_before: prev ? prev.state : 0,
      state_after: nextState.state,
    };

    // Fire-and-forget through rest() so a 401 (e.g. mid-session token expiry)
    // transparently refreshes and retries instead of silently dropping the
    // write.
    rest('/user_card_state?on_conflict=user_id,card_id', SESSION, {
      method: 'POST',
      body: upsert,
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    }).catch(function (e) { console.warn('save state failed', e); });

    rest('/user_review_log', SESSION, {
      method: 'POST',
      body: logEntry,
      headers: { 'Prefer': 'return=minimal' },
    }).catch(function (e) { console.warn('save review failed', e); });

    SESSION_REVIEWS += 1;
    nextCard();
  }

  // Anki-style "Previous" / undo. Pops the last rated card off HISTORY,
  // restores both the displayed card AND its USER_STATE row, and shows it
  // flipped so the user can re-rate. The next rate() call overwrites the
  // earlier server-side upsert (same composite PK), so re-rating doesn't
  // double-count. We DON'T re-insert into QUEUE; if they rate this card
  // again, that becomes the new tail and they continue forward.
  function goPrevious() {
    if (!HISTORY.length) return;
    var entry = HISTORY.pop();
    // Restore previous user_card_state row (or remove it if the card was new).
    if (entry.prevState) {
      USER_STATE[entry.card.id] = entry.prevState;
    } else {
      delete USER_STATE[entry.card.id];
    }
    // If we'd already advanced to a later card, that card is still in
    // CURRENT/QUEUE -- push CURRENT back onto QUEUE front so it's the next
    // card after the user re-rates.
    if (CURRENT && CURRENT.id !== entry.card.id) QUEUE.unshift(CURRENT);
    CURRENT = entry.card;
    CURRENT_FLIPPED = true;
    IMAGE_PEEKED = false;
    // SESSION_REVIEWS gets one back too, since they're going to re-rate.
    SESSION_REVIEWS = Math.max(0, SESSION_REVIEWS - 1);
    renderCard();
  }

  // Un-flip: return to the front of the same card without advancing.
  function unflip() {
    CURRENT_FLIPPED = false;
    renderCard();
  }

  // How many cards across all decks have never been seen yet?
  function countUnseenCards() {
    if (!STATIC || !STATIC.cards) return 0;
    var n = 0;
    STATIC.cards.forEach(function (c) { if (!USER_STATE[c.id]) n++; });
    return n;
  }

  // "Study N more (today only)" override. Adds N to today's extra slot,
  // rebuilds the queue for the active deck if any, and starts a fresh
  // review run. If the active deck has no unseen cards left, routes to
  // the deck picker so the user can pick a deck that does.
  function studyExtraNew(n) {
    addExtraToday(n);
    console.info('[tlm-app] +' + n + ' extra new today; total extra now', getExtraToday());
    if (ACTIVE_DECK) {
      SESSION_REVIEWS = 0;
      HISTORY = [];
      buildQueue();
      if (QUEUE.length > 0) {
        nextCard();
        return;
      }
    }
    // Either no active deck or the active deck has no fresh cards left.
    // Drop on deck picker; the new daily-goal numbers show the override.
    showDeckPicker();
  }

  // ─── Done state ─────────────────────────────────────────────────────────
  function showDone() {
    var stats = getTodayStats();
    var main = document.getElementById('main');

    // Four flavours of "you're done" depending on what just happened.
    // Important: SESSION_REVIEWS counts only the current sitting; reviewedToday
    // counts every review since local midnight. They diverge when the user
    // opens the deck again after an earlier session.
    var headline, message;
    var n = stats.reviewedToday;
    var nWord = n + ' card' + (n === 1 ? '' : 's');
    if (SESSION_REVIEWS === 0 && n === 0) {
      headline = 'All caught up';
      message = "Nothing's due right now. Check the calendar for when your next cards come around.";
    } else if (SESSION_REVIEWS === 0 && n > 0) {
      // Returning visit after they already hit their target earlier today.
      headline = 'Already done for today';
      message = "You've reviewed " + nWord + " today. Rest now and come back tomorrow for the next batch.";
    } else if (SESSION_REVIEWS > 0 && n === SESSION_REVIEWS) {
      // First session of the day, queue cleared cleanly.
      headline = 'Done for today';
      message = 'You reviewed ' + nWord + '. Rest now and come back tomorrow.';
    } else {
      // Mid-day: this session adds onto an earlier one.
      headline = 'Done for today';
      message = 'Another ' + SESSION_REVIEWS + ' card' + (SESSION_REVIEWS === 1 ? '' : 's')
              + ' in this session, ' + nWord + ' total today. Rest now and come back tomorrow.';
    }

    var unseen = countUnseenCards();
    var extraSize = Math.min(5, unseen);
    var extraBtn = '';
    if (extraSize > 0) {
      extraBtn = '<button class="extra-btn" id="goExtraBtn">'
               + '+ Study ' + extraSize + ' more new (today only)'
               + '</button>';
    }

    main.innerHTML = '<div class="done">'
                   + '<h2>' + escapeHtml(headline) + '</h2>'
                   + '<p>' + escapeHtml(message) + '</p>'
                   + '<div class="done-stats">'
                     + '<div class="stat-tile"><span class="num">' + stats.reviewedToday + '</span><span class="lbl">Reviewed today</span></div>'
                     + '<div class="stat-tile"><span class="num">' + stats.newIntroducedToday + '</span><span class="lbl">New started</span></div>'
                     + '<div class="stat-tile"><span class="num">' + stats.dueNow + '</span><span class="lbl">Still due</span></div>'
                   + '</div>'
                   + '<div class="done-cta">'
                     + '<button class="reveal-btn" id="goCalBtn">View calendar</button>'
                     + extraBtn
                     + '<button class="link-btn" id="goDecksBtn">Back to decks</button>'
                   + '</div>'
                   + '</div>';
    document.getElementById('goCalBtn').addEventListener('click', showCalendar);
    document.getElementById('goDecksBtn').addEventListener('click', showDeckPicker);
    var extraBtnEl = document.getElementById('goExtraBtn');
    if (extraBtnEl) extraBtnEl.addEventListener('click', function () { studyExtraNew(5); });
  }

  function showErr(msg) {
    document.getElementById('main').innerHTML = '<div class="err-msg">' + escapeHtml(msg) + '</div>';
  }

  // ─── Utils ──────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatRole(r) {
    if (!r) return '';
    return r.charAt(0).toUpperCase() + r.slice(1);
  }
</script>
