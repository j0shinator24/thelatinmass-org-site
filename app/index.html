<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>The Latin Mass — Study</title>
<meta name="description" content="Spaced-repetition flashcards for the 1962 Tridentine Latin Mass.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<link rel="preconnect" href="https://kugcbqfqataxbyjtaume.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Cinzel:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #2A2520;
    --ink-soft: #5A5048;
    --cream: #F7F2EA;
    --cream-soft: #FBF8F2;
    --rule: #E2D9CB;
    --taupe: #987F71;
    --taupe-dark: #7A6357;
    --taupe-deep: #5C4A40;
    --gold: #C8A871;
    --burgundy: #5E2A2A;
    --slider-cream: #E8DAC4;
    --green: #4a6e5a;
    --green-bright: #5d8a72;
    --amber: #b8862e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Lato', system-ui, sans-serif;
    font-weight: 300;
    color: var(--ink);
    background: var(--cream-soft);
    line-height: 1.65;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    line-height: 1.2;
    color: var(--ink);
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
    font-weight: 500;
  }

  /* ─── Header ─── */
  header.app-header {
    background: #fff;
    border-bottom: 1px solid var(--rule);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header.app-header .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--ink);
    font-weight: 500;
    text-decoration: none;
  }
  header.app-header .brand em { font-style: italic; color: var(--taupe-deep); }
  header.app-header nav {
    display: flex;
    gap: 16px;
    align-items: center;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  header.app-header nav a, header.app-header nav button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 4px;
    font: inherit;
  }
  header.app-header nav a:hover, header.app-header nav button:hover { color: var(--burgundy); }
  header.app-header .user { color: var(--taupe); font-family: 'Lato', sans-serif; font-size: 0.78rem; letter-spacing: 0; text-transform: none; }

  /* ─── Layout ─── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ─── Loading / status ─── */
  .status-msg {
    text-align: center;
    padding: 64px 20px;
    color: var(--taupe-dark);
    font-style: italic;
  }
  .err-msg {
    color: var(--burgundy);
    background: #f8e8e8;
    border: 1px solid var(--burgundy);
    padding: 14px 18px;
    margin: 16px 0;
    border-radius: 2px;
    font-size: 0.95rem;
  }

  /* ─── Deck picker ─── */
  .deck-picker { padding: 16px 0; }
  .deck-picker h2 {
    font-size: clamp(1.7rem, 3vw, 2.3rem);
    text-align: center;
    margin-bottom: 8px;
  }
  .deck-picker p.lede {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }
  .deck-list { display: flex; flex-direction: column; gap: 16px; }
  .deck-card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 24px 24px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, transform 0.15s;
    font-family: inherit;
    width: 100%;
  }
  .deck-card:hover { border-color: var(--taupe); }
  .deck-card:active { transform: scale(0.99); }
  .deck-card h3 {
    font-size: 1.5rem;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .deck-card p { color: var(--ink-soft); font-size: 0.95rem; }
  .deck-card .stats {
    margin-top: 12px;
    display: flex;
    gap: 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  .deck-card .stats .num { color: var(--burgundy); font-weight: 600; }

  /* ─── Card view ─── */
  .card-section { display: flex; flex-direction: column; gap: 24px; }
  .progress {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    color: var(--taupe);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .progress > .prog-mid { text-align: center; }
  .progress > #backBtn { justify-self: start; }
  .progress > .prev-btn { justify-self: end; }
  .progress button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font: inherit;
    padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .progress button:hover { color: var(--burgundy); }
  .progress .prev-btn[disabled] { color: #cdc4b6; cursor: default; }
  .progress .prev-btn[disabled]:hover { color: #cdc4b6; }

  /* Un-flip button below the rate row -- secondary action, smaller. */
  .unflip-btn {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 12px;
    margin: 4px auto 0;
    display: block;
    min-height: 40px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .unflip-btn:hover { color: var(--burgundy); }
  .card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 56px 32px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 18px;
  }
  .card .prompt-label {
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  /* Interlinear English gloss: red italic sitting just above the Latin,
     same convention as a hand-missal's bilingual layout. */
  .card .interlinear {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    line-height: 1.35;
    color: #B33A3A;
    margin: 4px 0 -4px;
    max-width: 100%;
    word-wrap: break-word;
  }
  .card .front {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 500;
    color: var(--burgundy);
    line-height: 1.15;
    max-width: 100%;
    word-wrap: break-word;
  }
  .card .back {
    margin-top: 12px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    width: 100%;
  }
  .card .back .english {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .card .back .meta {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .card .back .meta .pos {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-right: 8px;
  }
  .card .back .forms {
    margin-top: 10px;
    font-family: 'Lato', monospace, sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    word-spacing: 0.1em;
  }
  .card .back .role {
    font-style: italic;
    color: var(--taupe);
    font-size: 0.9rem;
    margin-top: 8px;
  }
  /* Educational gloss for notes that need a usage explanation
     (capitalisation, false friends, ecclesiastical vs classical sense). */
  .card .back .card-note {
    margin-top: 16px;
    padding: 12px 14px;
    border-left: 2px solid var(--gold);
    background: var(--cream);
    color: var(--ink-soft);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    line-height: 1.5;
    text-align: left;
  }

  /* ─── Card media (image + audio) ─── */
  /* Image fits inside the card's content area, full width up to a sensible
     cap, square-cropped so non-1:1 sources don't distort. NO negative-margin
     tricks (those were the previous bug — pulled the image past the frame). */
  .card .card-image {
    width: 100%;
    margin: 0 0 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card .card-image img {
    display: block;
    width: 100%;
    max-width: 280px;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 1px solid var(--rule);
    background: var(--cream);
    border-radius: 2px;
  }
  .card .back .card-audio {
    margin: 6px 0 14px;
    display: flex;
    justify-content: center;
  }
  .audio-btn {
    background: var(--cream);
    border: 1px solid var(--rule);
    color: var(--taupe-deep);
    padding: 6px 14px 6px 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, color 0.15s;
  }
  .audio-btn:hover { border-color: var(--burgundy); color: var(--burgundy); }
  .audio-btn svg { display: block; }

  /* Optional pre-flip image hint. Sits between the card and the Show
     answer button, dim and unobtrusive so it doesn't compete for attention. */
  .peek-row {
    display: flex;
    justify-content: center;
    margin: 12px 0 0;
  }
  .peek-btn {
    background: transparent;
    border: 1px dashed var(--rule);
    color: var(--taupe);
    padding: 6px 14px 6px 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, color 0.15s;
  }
  .peek-btn:hover { border-color: var(--taupe); color: var(--taupe-deep); }
  .peek-btn svg { display: block; opacity: 0.7; }

  /* ─── Buttons ─── */
  .reveal-btn {
    background: var(--burgundy);
    color: #fff;
    border: 1px solid var(--burgundy);
    padding: 14px 28px;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    min-height: 48px;
    transition: background 0.2s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reveal-btn:hover, .reveal-btn:active { background: var(--taupe-deep); border-color: var(--taupe-deep); }

  /* ─── OAuth divider + buttons (reused on session-expired screen) ─── */
  .oauth-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 18px;
    color: var(--taupe);
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .oauth-divider::before, .oauth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .oauth-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .oauth-btn {
    background: #fff;
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 12px 8px;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .oauth-btn:hover { border-color: var(--taupe); }
  .oauth-btn:active { transform: scale(0.98); }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .oauth-btn-apple { background: #000; color: #fff; border-color: #000; }
  .oauth-btn-apple:hover { border-color: #444; }

  .rate-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .rate-btn {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 8px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 56px;
    color: var(--ink);
    transition: all 0.18s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .rate-btn:hover, .rate-btn:active { transform: translateY(-1px); }
  .rate-btn .interval-hint {
    font-family: 'Lato', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--taupe);
    font-weight: 300;
  }
  .rate-btn[data-rating="1"] { border-color: #c08383; color: var(--burgundy); }
  .rate-btn[data-rating="1"]:hover { background: #f8e8e8; }
  .rate-btn[data-rating="2"] { border-color: var(--amber); color: #8a6b22; }
  .rate-btn[data-rating="2"]:hover { background: #f9eed5; }
  .rate-btn[data-rating="3"] { border-color: var(--green); color: var(--green); }
  .rate-btn[data-rating="3"]:hover { background: #e6efe9; }
  .rate-btn[data-rating="4"] { border-color: var(--taupe); color: var(--taupe-deep); }
  .rate-btn[data-rating="4"]:hover { background: #f3eee5; }

  /* ─── Done ─── */
  .done {
    text-align: center;
    padding: 48px 24px;
    background: #fff;
    border: 1px solid var(--rule);
  }
  .done h2 { font-size: 2rem; color: var(--burgundy); margin-bottom: 8px; }
  .done p { color: var(--ink-soft); margin-bottom: 24px; max-width: 420px; margin-left: auto; margin-right: auto; }
  .done-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 420px;
    margin: 0 auto 28px;
  }
  .done-stats .stat-tile {
    background: var(--cream);
    border: 1px solid var(--rule);
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .done-stats .stat-tile .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .done-stats .stat-tile .lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    text-align: center;
  }
  .done-cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 320px;
    margin: 0 auto;
  }
  .link-btn {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .link-btn:hover { color: var(--burgundy); }
  .extra-btn {
    background: transparent;
    border: 1px dashed var(--burgundy);
    color: var(--burgundy);
    padding: 12px 20px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  .extra-btn:hover { background: rgba(94,42,42,0.06); }

  /* ─── Daily-goal mini bar shown above the flashcard ─── */
  .card-goal {
    margin: -12px 0 -4px;
    padding: 8px 12px;
    background: var(--cream);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .card-goal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe-deep);
  }
  .card-goal-badge {
    color: var(--green);
    font-size: 0.95rem;
    line-height: 1;
  }
  .card-goal-bar {
    height: 4px;
    background: #e8dac4;
    overflow: hidden;
    border-radius: 2px;
  }
  .card-goal-bar-fill {
    display: block;
    height: 100%;
    background: var(--burgundy);
    transition: width 0.35s ease-out;
  }

  /* ─── Today's goal banner (Calendar view) ─── */
  .goal-banner {
    background: #fff;
    border: 1px solid var(--burgundy);
    padding: 18px 18px 16px;
    margin-bottom: 22px;
  }
  .goal-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .goal-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--burgundy);
  }
  .goal-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    color: var(--ink);
    font-weight: 600;
  }
  .goal-bar {
    height: 8px;
    background: var(--cream);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .goal-bar-fill {
    display: block;
    height: 100%;
    background: var(--burgundy);
    transition: width 0.3s ease-out;
  }
  .goal-sub {
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  /* Daily-target settings strip below the goal banner. */
  .goal-settings {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .goal-settings-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .goal-settings-title {
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-deep);
  }
  .goal-settings-current {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--burgundy);
    font-weight: 600;
  }
  .target-chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .target-chip {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 10px 4px;
    cursor: pointer;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .target-chip:hover { border-color: var(--taupe); }
  .target-chip.active {
    background: var(--burgundy);
    border-color: var(--burgundy);
    color: #fff;
  }
  .target-chip.active .chip-lbl { color: rgba(255,255,255,0.85); }
  .target-chip .chip-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 600;
    line-height: 1;
  }
  .target-chip .chip-lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.54rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    line-height: 1.2;
    text-align: center;
  }
  .goal-settings-hint {
    font-size: 0.82rem;
    color: var(--ink-soft);

<header class="app-header">

<main id="main">
  <div class="status-msg" id="loadingMsg">Loading…</div>
</main>

<script>
  // IMPORTANT: when bumping APP_BUILD, also update app/version.json to match,
  // otherwise users on stale-cached HTML won't auto-reload.
  var APP_BUILD = 'v26-2026-05-11-today-breakdown';
  console.info('[thelatinmass] app-' + APP_BUILD);

  // ─── Stale-cache auto-reload ───────────────────────────────────────────
  // GitHub Pages serves HTML with Cache-Control: max-age=600, so users can
  // sit on stale code for up to 10 min after a deploy. We fetch a tiny
  // version.json (cache-busted) on boot and silently reload with ?cb=...
  // if the server build is newer than the embedded one.
  (function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.build && d.build !== APP_BUILD) {
          console.info('[thelatinmass] new build available:', d.build, '-- reloading');
          location.replace(location.pathname + '?cb=' + encodeURIComponent(d.build) + location.hash);
        }
      })
      .catch(function () { /* network blip, ignore */ });
  })();

  var SUPABASE_URL = 'https://kugcbqfqataxbyjtaume.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_E90qtGbDdlijn20tF5nVZw_CMe7goVi';
  var REST = SUPABASE_URL + '/rest/v1';
  var AUTH = SUPABASE_URL + '/auth/v1';

  // ─── Auth bootstrapping ─────────────────────────────────────────────────
  // Reads tlm_session from localStorage, refreshes the access token if it's
  // expired (or about to be), and returns a usable session — or null if the
  // session is unrecoverable. Single in-flight refresh is shared via a
  // cached Promise so concurrent rest() calls don't all issue refresh requests.
  var _refreshInFlight = null;

  function readRawSession() {
    try {
      var raw = localStorage.getItem('tlm_session');
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.access_token || !s.user) return null;
      return s;
    } catch (_) { return null; }
  }

  function isExpiringSoon(s) {
    var expAt = s && s.expires_at ? s.expires_at * 1000 : 0;
    if (!expAt) return false;
    // Refresh if within 60 seconds of expiry (or already past it)
    return Date.now() >= expAt - 60000;
  }

  function refreshSession(s) {
    if (_refreshInFlight) return _refreshInFlight;
    if (!s || !s.refresh_token) {
      return Promise.resolve(null);
    }
    console.info('[tlm-app] refreshing access token');
    _refreshInFlight = fetch(AUTH + '/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (res) {
      if (res.ok && res.body && res.body.access_token) {
        // Supabase refresh response sometimes omits expires_at — derive from
        // expires_in if missing, so isExpiringSoon() works next time.
        if (!res.body.expires_at && res.body.expires_in) {
          res.body.expires_at = Math.floor(Date.now() / 1000) + res.body.expires_in;
        }
        // Preserve user object across refresh (some refresh responses elide it)
        if (!res.body.user && s.user) res.body.user = s.user;
        localStorage.setItem('tlm_session', JSON.stringify(res.body));
        console.info('[tlm-app] refresh ok, new expiry:', new Date(res.body.expires_at * 1000).toISOString());
        return res.body;
      }
      console.warn('[tlm-app] refresh failed:', res.body);
      return null;
    }).catch(function (e) {
      console.warn('[tlm-app] refresh threw:', e);
      return null;
    }).finally(function () {
      _refreshInFlight = null;
    });
    return _refreshInFlight;
  }

  // Returns a usable session (refreshed if needed) or null. Awaitable.
  function loadSession() {
    var s = readRawSession();
    if (!s) return Promise.resolve(null);
    if (!isExpiringSoon(s)) return Promise.resolve(s);
    return refreshSession(s);
  }

  function redirectToLanding() { location.href = '../'; }

  function signOut() {
    var s = readRawSession();
    if (s && s.access_token) {
      fetch(AUTH + '/logout', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + s.access_token,
        },
      }).catch(function () {});
    }
    localStorage.removeItem('tlm_session');
    redirectToLanding();
  }
  document.getElementById('signoutBtn').addEventListener('click', signOut);

  // ─── Supabase REST helpers (with user JWT) ──────────────────────────────
  function authHeaders(session) {
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
  }
  // rest() — issues a PostgREST request with the current session's JWT.
  // On 401 it transparently refreshes the token and retries once, so a study
  // session that crosses the 1h access-token boundary doesn't fall over.
  function rest(path, session, opts) {
    opts = opts || {};
    var extraHeaders = opts.headers || {};
    function exec(sess) {
      return fetch(REST + path, {
        method: opts.method || 'GET',
        headers: Object.assign({}, authHeaders(sess), extraHeaders),
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      }).then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = t ? JSON.parse(t) : null; } catch (_) {}
          return { ok: r.ok, status: r.status, body: j };
        });
      });
    }
    return exec(session).then(function (res) {
      if (res.status === 401 && !opts._retried) {
        return refreshSession(readRawSession()).then(function (newSess) {
          if (!newSess) {
            throw new Error('Session expired. Please sign in again.');
          }
          SESSION = newSess;
          opts._retried = true;
          return exec(newSess).then(function (r2) {
            if (!r2.ok) {
              var m = (r2.body && (r2.body.message || r2.body.error)) || ('HTTP ' + r2.status);
              throw new Error(m);
            }
            return r2.body;
          });
        });
      }
      if (!res.ok) {
        var msg = (res.body && (res.body.message || res.body.error || res.body.error_description)) || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      return res.body;
    });
  }

  // ─── State ──────────────────────────────────────────────────────────────
  var STATIC = null;
  var SESSION = null;
  var USER_STATE = {}; // card_id -> { due, stability, difficulty, reps, lapses, state, last_review }
  var ACTIVE_DECK = null;
  var QUEUE = [];
  var CURRENT = null;
  var CURRENT_FLIPPED = false;
  var IMAGE_PEEKED = false;
  // Undo history. Each entry is {card, prevUserState} captured BEFORE that
  // card was rated. "Previous" pops the top, restores card + state, lets the
  // user re-rate (overwrites the prior upsert).
  var HISTORY = [];
  var HISTORY_MAX = 50;
  // Two daily caps, both user-settable, both persisted to localStorage:
  //   NEW_PER_DAY = how many BRAND-NEW cards to introduce per day (intake)
  //   MAX_PER_DAY = total cards per day, INCLUDING due reviews (the goal)
  //
  // MAX determines "today's goal" shown everywhere. NEW determines how many
  // of those slots can be filled with unseen cards (the rest go to due
  // reviews). MAX is forced to be >= NEW so you can't make it nonsensical.
  var NEW_PER_DAY_DEFAULT = 10;
  var NEW_PER_DAY_KEY = 'tlm_new_per_day';
  var MAX_PER_DAY_DEFAULT = 30;
  var MAX_PER_DAY_KEY = 'tlm_max_per_day';
  function getDailyTarget() {
    try {
      var v = parseInt(localStorage.getItem(NEW_PER_DAY_KEY), 10);
      if (isFinite(v) && v >= 1 && v <= 100) return v;
    } catch (_) {}
    return NEW_PER_DAY_DEFAULT;
  }
  function setDailyTarget(n) {
    n = Math.max(1, Math.min(100, parseInt(n, 10) || NEW_PER_DAY_DEFAULT));
    try { localStorage.setItem(NEW_PER_DAY_KEY, String(n)); } catch (_) {}
    // Bump MAX too if NEW just exceeded it (always MAX >= NEW)
    if (getMaxPerDay() < n) setMaxPerDay(n);
    return n;
  }
  function getMaxPerDay() {
    var raw;
    try {
      var v = parseInt(localStorage.getItem(MAX_PER_DAY_KEY), 10);
      if (isFinite(v) && v >= 1 && v <= 500) raw = v;
    } catch (_) {}
    if (!isFinite(raw)) raw = MAX_PER_DAY_DEFAULT;
    // Floor at NEW so MAX can never be less than the new-card cap.
    return Math.max(raw, getDailyTarget());
  }
  function setMaxPerDay(n) {
    n = Math.max(1, Math.min(500, parseInt(n, 10) || MAX_PER_DAY_DEFAULT));
    n = Math.max(n, getDailyTarget());
    try { localStorage.setItem(MAX_PER_DAY_KEY, String(n)); } catch (_) {}
    return n;
  }

  // Today-only override: lets the user grab extra new cards beyond the daily
  // cap without changing the long-term setting. Stored per-date in
  // localStorage so it auto-clears at midnight.
  function todayKey() {
    var d = new Date();
    return 'tlm_extra_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getExtraToday() {
    try {
      var v = parseInt(localStorage.getItem(todayKey()), 10);
      if (isFinite(v) && v >= 0) return v;
    } catch (_) {}
    return 0;
  }
  function addExtraToday(n) {
    var next = getExtraToday() + Math.max(0, parseInt(n, 10) || 0);
    try { localStorage.setItem(todayKey(), String(next)); } catch (_) {}
    return next;
  }
  var REVIEW_START = 0;
  var SESSION_REVIEWS = 0;

  // ─── Boot ───────────────────────────────────────────────────────────────
  // Resolve the session async (will refresh if expired), then either run the
  // app or show a "session expired" screen. We never silently redirect away
  // from /app/ — that looked like a "click and refresh" bug to the user.
  loadSession().then(function (session) {
    SESSION = session;
    if (!SESSION) {
      showSignedOut();
      return;
    }
    boot();
  }).catch(function (err) {
    console.warn('[tlm-app] loadSession failed:', err);
    showSignedOut();
  });

  function boot() {
    console.info('[tlm-app] boot ok, user:', SESSION.user && SESSION.user.email);
    document.getElementById('userEmail').textContent = (SESSION.user && SESSION.user.email) || '';
    wireNav();
    Promise.all([fetchStatic(), fetchUserState()])
      .then(function () { showDeckPicker(); })
      .catch(function (err) {
        // 401 from fetchUserState would already have triggered a refresh+retry
        // inside rest(). If we still get here it's a hard failure — show it.
        showErr('Failed to load: ' + (err.message || err));
      });
  }

  // Track which top-level view is active so we can highlight the nav link.
  var ACTIVE_VIEW = 'decks';
  function setActiveView(v) {
    ACTIVE_VIEW = v;
    var ids = { decks: 'navDecks', calendar: 'navCalendar', stats: 'navStats' };
    Object.keys(ids).forEach(function (k) {
      var el = document.getElementById(ids[k]);
      if (!el) return;
      if (k === v) el.classList.add('active'); else el.classList.remove('active');
    });
  }

  function wireNav() {
    var byView = {
      decks: showDeckPicker,
      calendar: function () { showCalendar(); },
      stats: function () { showStats(); },
    };
    Object.keys(byView).forEach(function (k) {
      var btn = document.querySelector('[data-view="' + k + '"]');
      if (!btn) return;
      btn.addEventListener('click', function () { byView[k](); });
    });
  }

  function showSignedOut() {
    // Try to recover the email from the (now-stale) JWT so the form is

    var form = document.getElementById('reauthForm');

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.style.display = 'block';
      msg.style.background = kind === 'error' ? '#f8e8e8' : '#e6efe9';
      msg.style.border = '1px solid ' + (kind === 'error' ? '#c08383' : '#7da090');

    form.addEventListener('submit', function (e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (inFlight) return;

      try { document.activeElement && document.activeElement.blur(); } catch (_) {}

      btn.setAttribute('aria-busy', 'true');
      msg.style.display = 'none';

      var email = (emailEl.value || '').trim();

      if (!email || email.indexOf('@') === -1) {
        showMsg('Please enter a valid email address.', 'error');
        btn.disabled = false; inFlight = false; return;
      }
      if (!password || password.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error');
        btn.disabled = false; inFlight = false; return;
      }

      fetch(AUTH + '/token?grant_type=password', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      }).then(function (res) {
        if (!res.ok) {
          var em = (res.body && (res.body.msg || res.body.error_description || res.body.error)) || 'Sign-in failed';
          showMsg(em, 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
          return;
        }
        if (res.body && res.body.access_token) {
          try { localStorage.setItem('tlm_session', JSON.stringify(res.body)); } catch (_) {}
          showMsg('Signed in. Loading your decks…', 'success');
          // Reload the page so /app/ boots cleanly with the new session.
          setTimeout(function () { window.location.reload(); }, 400);
        } else {
          showMsg('Sign-in succeeded but no session was returned. Try again.', 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
        }
      }).catch(function (err) {
        showMsg((err && err.message) || 'Network error. Try again.', 'error');
        btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
      });
    });

    // OAuth buttons: redirect to Supabase /authorize, which sends the user
    // to the provider and back to https://thelatinmass.org/ with a session
    // hash. The landing page's callback IIFE parses that and bounces into
    // /app/. No JS-side token handling needed here.
    document.querySelectorAll('#main [data-oauth]').forEach(function (oauthBtn) {

          + '&redirect_to=' + redirectTo;
      });
    });

  function fetchStatic() {
    // Cache-bust by build version so a phone running an older app HTML never
    // gets stuck pairing it with stale static.json (or vice versa).
    return fetch('./static.json?v=' + APP_BUILD).then(function (r) {
      if (!r.ok) throw new Error('Could not load card data (HTTP ' + r.status + ')');
      return r.json();
    }).then(function (data) {
      STATIC = data;
      // Index notes and cards by id for fast lookup
      STATIC.notesById = {};
      data.notes.forEach(function (n) { STATIC.notesById[n.id] = n; });
      STATIC.cardsByDeck = {};
      data.cards.forEach(function (c) {
        if (!STATIC.cardsByDeck[c.deck_id]) STATIC.cardsByDeck[c.deck_id] = [];
        STATIC.cardsByDeck[c.deck_id].push(c);
      });
      // Sort each deck's cards by note frequency desc (most common first)
      Object.keys(STATIC.cardsByDeck).forEach(function (deckId) {
        STATIC.cardsByDeck[deckId].sort(function (a, b) {
          var na = STATIC.notesById[a.note_id];
          var nb = STATIC.notesById[b.note_id];
          var fa = (na && na.frequency) || 0;
          var fb = (nb && nb.frequency) || 0;
          if (fb !== fa) return fb - fa;
          return a.id - b.id;
        });
      });
    });
  }

  function fetchUserState() {
    return rest('/user_card_state?select=card_id,due,stability,difficulty,reps,lapses,state,last_review,scheduled_days&limit=10000', SESSION).then(function (rows) {
      USER_STATE = {};
      (rows || []).forEach(function (r) { USER_STATE[r.card_id] = r; });
    });
  }
