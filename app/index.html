<!DOCTYPE html>
<html lang="en-AU">
<head>

<title>The Latin Mass — Study</title>
<meta name="description" content="Spaced-repetition flashcards for the 1962 Tridentine Latin Mass.">

  // OS prefers-color-scheme is intentionally ignored -- see landing
  // index.html for the rationale.
  (function () {
    try {
      if (localStorage.getItem('tlm_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (_) {}
  })();
</script>

  // Thin helper for custom events. Use: tlmTrack('demo_flipped', {card:1});

<link rel="preconnect" href="https://kugcbqfqataxbyjtaume.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Cinzel:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #2A2520;
    --ink-soft: #4D4238;
    --cream: #F7F2EA;
    --cream-soft: #FBF8F2;
    --rule: #E2D9CB;
    --taupe: #987F71;
    --taupe-dark: #7A6357;
    --taupe-deep: #5C4A40;
    --gold: #C8A871;
    --burgundy: #5E2A2A;
    --slider-cream: #E8DAC4;
    --green: #4a6e5a;
    --green-bright: #5d8a72;
    --amber: #b8862e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Lato', system-ui, sans-serif;
    font-weight: 300;
    color: var(--ink);
    background: var(--cream-soft);
    line-height: 1.65;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    line-height: 1.2;
    color: var(--ink);
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
    font-weight: 500;
  }

  /* ─── Header ─── */
  header.app-header {
    background: #fff;
    border-bottom: 1px solid var(--rule);
    /* Extra right padding keeps the rightmost nav item (sign-out) clear
       of the fixed top-right theme-toggle FAB (42px button at right:18px,
       so reserve 70px to leave a comfortable gap). */
    padding: 14px 72px 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header.app-header .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--ink);
    font-weight: 500;
    text-decoration: none;
  }
  header.app-header .brand em { font-style: italic; color: var(--taupe-deep); }
  header.app-header nav {
    display: flex;
    gap: 16px;
    align-items: center;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  header.app-header nav a, header.app-header nav button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 4px;
    font: inherit;
  }
  header.app-header nav a:hover, header.app-header nav button:hover { color: var(--burgundy); }
  header.app-header .user { color: var(--taupe); font-family: 'Lato', sans-serif; font-size: 0.78rem; letter-spacing: 0; text-transform: none; }

  /* ─── Layout ─── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ─── Loading / status ─── */
  .status-msg {
    text-align: center;
    padding: 64px 20px;
    color: var(--taupe-dark);
    font-style: italic;
  }
  .err-msg {
    color: var(--burgundy);
    background: #f8e8e8;
    border: 1px solid var(--burgundy);
    padding: 14px 18px;
    margin: 16px 0;
    border-radius: 2px;
    font-size: 0.95rem;
  }

  /* ─── Deck picker ─── */
  .deck-picker { padding: 16px 0; }
  .deck-picker h2 {
    font-size: clamp(1.7rem, 3vw, 2.3rem);
    text-align: center;
    margin-bottom: 8px;
  }
  .deck-picker p.lede {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }
  .deck-list { display: flex; flex-direction: column; gap: 16px; }
  .deck-card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 24px 24px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, transform 0.15s;
    font-family: inherit;
    width: 100%;
  }
  .deck-card:hover { border-color: var(--taupe); }
  .deck-card:active { transform: scale(0.99); }
  .deck-card h3 {
    font-size: 1.5rem;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .deck-card p { color: var(--ink-soft); font-size: 0.95rem; }
  .deck-card .stats {
    margin-top: 12px;
    display: flex;
    gap: 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  .deck-card .stats .num { color: var(--burgundy); font-weight: 600; }
  /* Plain-language legend used under the deck list and stat grid so the
     short labels (Due/New/Total, Retention) never need prior knowledge. */
  .mini-legend {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--taupe);
    text-align: center;
    margin: 14px auto 0;
    max-width: 540px;
    padding: 0 16px;
  }
  .mini-legend strong { color: var(--ink-soft); font-weight: 600; }

  /* ─── Card view ─── */
  .card-section { display: flex; flex-direction: column; gap: 24px; }
  .progress {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    color: var(--taupe);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .progress > .prog-mid { text-align: center; }
  .progress > #backBtn { justify-self: start; }
  .progress > .prev-btn { justify-self: end; }
  .progress button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font: inherit;
    padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .progress button:hover { color: var(--burgundy); }
  .progress .prev-btn[disabled] { color: #cdc4b6; cursor: default; }
  .progress .prev-btn[disabled]:hover { color: #cdc4b6; }

  /* Un-flip button below the rate row -- secondary action, smaller. */
  .unflip-btn {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 12px;
    margin: 4px auto 0;
    display: block;
    min-height: 40px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .unflip-btn:hover { color: var(--burgundy); }
  .card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 56px 32px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 18px;
  }
  .card .prompt-label {
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  /* Interlinear English gloss: red italic sitting just above the Latin,
     same convention as a hand-missal's bilingual layout. */
  .card .interlinear {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    line-height: 1.2;
    color: #B33A3A;
    margin: 4px 0 10px;
    max-width: 100%;
    word-wrap: break-word;
  }
  /* Help text sitting above the rate buttons. Kept readable on small
     phone screens (was 0.7rem, too small to scan mid-review). */
  .rating-help {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--ink-soft);
    text-align: center;
    margin: 18px auto 10px;
    max-width: 520px;
    padding: 0 16px;
  }
  .rating-help strong { color: var(--ink); font-weight: 600; }
  /* Card state pill — new / learning / review. */
  .card-state-pill {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .card-state-pill.cs-new      { background: #e0ecf5; color: #2b5d8a; }
  .card-state-pill.cs-learning { background: #f9eed5; color: #8a6b22; }
  .card-state-pill.cs-review   { background: #e6efe9; color: #2d5d3f; }

  /* ─── Settings page ─────────────────────────────────────────────────── */
  .settings-page { max-width: 560px; margin: 0 auto; padding: 0 0 60px; }
  .settings-section {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .settings-section h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-deep);
    margin: 0 0 12px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-top: 1px solid var(--rule);
  }
  .settings-row:first-of-type { border-top: 0; padding-top: 4px; }
  .settings-row .label-stack { flex: 1; min-width: 0; }
  .settings-row .label-stack .lbl {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.3;
  }
  .settings-row .label-stack .hint {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 2px;
    line-height: 1.4;
  }
  /* Toggle switch */
  .toggle {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    border-radius: 24px;
    transition: background 0.18s;
  }
  .toggle .slider::before {
    position: absolute;
    content: '';
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.18s;
  }
  .toggle input:checked + .slider { background: var(--green); }
  .toggle input:checked + .slider::before { transform: translateX(20px); }
  .toggle input:focus-visible + .slider { outline: 2px solid var(--burgundy); outline-offset: 2px; }
  /* Settings-page secondary buttons. Re-use reveal-btn for the primary. */
  .settings-btn {
    appearance: none;
    background: #fff;
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 10px 14px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .settings-btn:hover { border-color: var(--taupe); }
  .settings-btn.danger { color: var(--burgundy); border-color: #c08383; }
  .settings-btn.danger:hover { background: #f8e8e8; }
  .settings-msg {
    margin-top: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    border: 1px solid transparent;
    display: none;
  }
  .settings-msg.ok    { background: #e6efe9; border-color: #7da090; color: var(--green); }
  .settings-msg.error { background: #f8e8e8; border-color: #c08383; color: var(--burgundy); }
  .card .front {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 500;
    color: var(--burgundy);
    line-height: 1.15;
    max-width: 100%;
    word-wrap: break-word;
  }
  .card .back {
    margin-top: 12px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    width: 100%;
  }
  .card .back .english {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .card .back .meta {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .card .back .meta .pos {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-right: 8px;
  }
  .card .back .forms {
    margin-top: 14px;
  }
  .card .back .forms-label {
    font-family: 'Lato', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-bottom: 8px;
  }
  .card .back .forms-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card .back .form-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--cream);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 5px 12px 6px;
    min-width: 58px;
  }
  .card .back .form-en {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.82rem;
    color: #B33A3A;
    line-height: 1.2;
    margin-bottom: 3px;
  }
  .card .back .form-lat {
    font-family: 'Lato', sans-serif;
    font-size: 0.93rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
  }
  .card .back .form-ct {
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--taupe);
  }
  .card .back .forms-primer-toggle {
    margin-top: 10px;
    padding: 0;
    background: none;
    border: 0;
    border-bottom: 1px dotted var(--taupe);
    color: var(--taupe-dark);
    font-family: 'Lato', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    line-height: 1.4;
  }
  .card .back .forms-primer-toggle:hover { color: var(--burgundy); }
  .card .back .forms-primer {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--cream);
    border-left: 2px solid var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .card .back .forms-primer[hidden] { display: none; }
  .card .back .role {
    font-style: italic;
    color: var(--taupe);
    font-size: 0.9rem;
    margin-top: 8px;
  }
  /* Educational gloss for notes that need a usage explanation
     (capitalisation, false friends, ecclesiastical vs classical sense). */
  .card .back .card-note {
    margin-top: 16px;
    padding: 12px 14px;
    border-left: 2px solid var(--gold);
    background: var(--cream);
    color: var(--ink-soft);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    line-height: 1.5;
    text-align: left;
  }

  /* ─── Card media (image + audio) ─── */
  /* Image fits inside the card's content area, full width up to a sensible
     cap, square-cropped so non-1:1 sources don't distort. NO negative-margin
     tricks (those were the previous bug — pulled the image past the frame). */
  .card .card-image {
    width: 100%;
    margin: 0 0 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card .card-image img {
    display: block;
    width: 100%;
    max-width: 280px;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 1px solid var(--rule);
    background: var(--cream);
    border-radius: 2px;
  }
  .card .back .card-audio {
    margin: 6px 0 14px;
    display: flex;
    justify-content: center;
  }
  .audio-btn {
    background: var(--cream);
    border: 1px solid var(--rule);
    color: var(--taupe-deep);
    padding: 6px 14px 6px 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, color 0.15s;
  }
  .audio-btn:hover { border-color: var(--burgundy); color: var(--burgundy); }
  .audio-btn svg { display: block; }

  /* Optional pre-flip image hint. Sits between the card and the Show
     answer button, dim and unobtrusive so it doesn't compete for attention. */
  .peek-row {
    display: flex;
    justify-content: center;
    margin: 12px 0 0;
  }
  .peek-btn {
    background: transparent;
    border: 1px dashed var(--rule);
    color: var(--taupe);
    padding: 6px 14px 6px 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, color 0.15s;
  }
  .peek-btn:hover { border-color: var(--taupe); color: var(--taupe-deep); }
  .peek-btn svg { display: block; opacity: 0.7; }

  /* ─── Buttons ─── */
  .reveal-btn {
    background: var(--burgundy);
    color: #fff;
    border: 1px solid var(--burgundy);
    padding: 14px 28px;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    min-height: 48px;
    transition: background 0.2s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reveal-btn:hover, .reveal-btn:active { background: var(--taupe-deep); border-color: var(--taupe-deep); }

  /* ─── OAuth divider + buttons (reused on session-expired screen) ─── */
  .oauth-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 18px;
    color: var(--taupe);
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .oauth-divider::before, .oauth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .oauth-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .oauth-btn {
    background: #fff;
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 12px 8px;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .oauth-btn:hover { border-color: var(--taupe); }
  .oauth-btn:active { transform: scale(0.98); }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .rate-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .rate-btn {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 8px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 56px;
    color: var(--ink);
    transition: all 0.18s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .rate-btn:hover, .rate-btn:active { transform: translateY(-1px); }
  .rate-btn .interval-hint {
    font-family: 'Lato', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--taupe);
    font-weight: 300;
  }
  .rate-btn[data-rating="1"] { border-color: #c08383; color: var(--burgundy); }
  .rate-btn[data-rating="1"]:hover { background: #f8e8e8; }
  .rate-btn[data-rating="2"] { border-color: var(--amber); color: #8a6b22; }
  .rate-btn[data-rating="2"]:hover { background: #f9eed5; }
  .rate-btn[data-rating="3"] { border-color: var(--green); color: var(--green); }
  .rate-btn[data-rating="3"]:hover { background: #e6efe9; }
  .rate-btn[data-rating="4"] { border-color: var(--taupe); color: var(--taupe-deep); }
  .rate-btn[data-rating="4"]:hover { background: #f3eee5; }

  /* ─── Done ─── */
  .done {
    text-align: center;
    padding: 48px 24px;
    background: #fff;
    border: 1px solid var(--rule);
  }
  .done h2 { font-size: 2rem; color: var(--burgundy); margin-bottom: 8px; }
  .done p { color: var(--ink-soft); margin-bottom: 24px; max-width: 420px; margin-left: auto; margin-right: auto; }
  .done-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 420px;
    margin: 0 auto 28px;
  }
  .done-stats .stat-tile {
    background: var(--cream);
    border: 1px solid var(--rule);
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .done-stats .stat-tile .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .done-stats .stat-tile .lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    text-align: center;
  }
  .done-cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 320px;
    margin: 0 auto;
  }
  .link-btn {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .link-btn:hover { color: var(--burgundy); }
  .extra-btn {
    background: transparent;
    border: 1px dashed var(--burgundy);
    color: var(--burgundy);
    padding: 12px 20px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  .extra-btn:hover { background: rgba(94,42,42,0.06); }

  /* ─── Daily-goal mini bar shown above the flashcard ─── */
  .card-goal {
    margin: -12px 0 -4px;
    padding: 8px 12px;
    background: var(--cream);
    border: 1px solid var(--rule);
    border-radius: 2px;
  }
  .card-goal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe-deep);
  }
  .card-goal-badge {
    color: var(--green);
    font-size: 0.95rem;
    line-height: 1;
  }
  .card-goal-bar {
    height: 4px;
    background: #e8dac4;
    overflow: hidden;
    border-radius: 2px;
  }
  .card-goal-bar-fill {
    display: block;
    height: 100%;
    background: var(--burgundy);
    transition: width 0.35s ease-out;
  }

  /* ─── Today's goal banner (Calendar view) ─── */
  .goal-banner {
    background: #fff;
    border: 1px solid var(--burgundy);
    padding: 18px 18px 16px;
    margin-bottom: 22px;
  }
  .goal-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .goal-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--burgundy);
  }
  .goal-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    color: var(--ink);
    font-weight: 600;
  }
  .goal-bar {
    height: 8px;
    background: var(--cream);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .goal-bar-fill {
    display: block;
    height: 100%;
    background: var(--burgundy);
    transition: width 0.3s ease-out;
  }
  .goal-sub {
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  /* Daily-target settings strip below the goal banner. */
  .goal-settings {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .goal-settings-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .goal-settings-title {
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-deep);
  }
  .goal-settings-current {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--burgundy);
    font-weight: 600;
  }
  .target-chips {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .target-chip {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 10px 4px;
    cursor: pointer;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .target-chip:hover { border-color: var(--taupe); }
  .target-chip.active {
    background: var(--burgundy);
    border-color: var(--burgundy);
    color: #fff;
  }
  .target-chip.active .chip-lbl { color: rgba(255,255,255,0.85); }
  .target-chip .chip-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 600;
    line-height: 1;
  }
  .target-chip .chip-lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.54rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    line-height: 1.2;
    text-align: center;
  }
  .goal-settings-hint {
    font-size: 0.82rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .goal-settings-hint em {
    font-style: italic;
    color: var(--ink);
  }
  .goal-science {
    border-top: 1px solid var(--rule);
    padding-top: 12px;
    margin-top: 4px;
  }
  .goal-science > summary {
    cursor: pointer;
    list-style: none;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-deep);
    -webkit-tap-highlight-color: transparent;
    padding: 4px 0;
  }
  .goal-science > summary::-webkit-details-marker { display: none; }
  .goal-science > summary::before {
    content: '▸';
    margin-right: 8px;
    color: var(--taupe);
    transition: transform 0.15s;
    display: inline-block;
  }
  .goal-science[open] > summary::before { transform: rotate(90deg); }
  .goal-science > summary:hover { color: var(--burgundy); }
  .goal-science-body {
    margin-top: 12px;
    color: var(--ink-soft);
    font-size: 0.86rem;
    line-height: 1.6;
  }
  .goal-science-body p { margin-bottom: 12px; }
  .goal-science-body p:last-child { margin-bottom: 0; }
  .goal-science-body strong { color: var(--ink); font-weight: 600; }
  .goal-science-body em { font-style: italic; color: var(--ink); }
  .goal-science-body a {
    color: var(--burgundy);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .goal-science-body a:hover { color: var(--taupe-deep); }

  /* ─── Nav active state ─── */
  header.app-header nav a.active,
  header.app-header nav button.active { color: var(--burgundy); border-bottom: 2px solid var(--burgundy); }

  /* ─── Calendar / forecast view ─── */
  .view-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .view-header h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); margin-bottom: 8px; }
  .view-header .lede { color: var(--ink-soft); font-size: 0.95rem; }

  .forecast-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .forecast-summary .stat {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 18px 12px;
    text-align: center;
  }
  .forecast-summary .stat .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .forecast-summary .stat .lbl {
    margin-top: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .forecast-list { display: flex; flex-direction: column; gap: 6px; }
  .forecast-row {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .forecast-row.today { border-color: var(--burgundy); }
  .forecast-row .day {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink);
  }
  .forecast-row .day .sub {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-left: 8px;
  }
  .forecast-row .bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--cream);
    margin: 0 14px;
    position: relative;
  }
  .forecast-row .bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--burgundy);
  }
  .forecast-row .count {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--burgundy);
    font-weight: 600;
    min-width: 32px;
    text-align: right;
  }
  .forecast-row .count-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    min-width: 72px;
  }
  .forecast-row .count-stack .num {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .forecast-row .count-stack .breakdown {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--burgundy);
    opacity: 0.78;
    font-weight: 500;
    line-height: 1.1;
    white-space: nowrap;
  }
  .forecast-row.empty .count { color: var(--taupe); font-weight: 400; }
  .forecast-row.empty .count-stack .num { color: var(--taupe); font-weight: 400; }
  .forecast-row.empty .count-stack .breakdown { color: var(--taupe); }
  .forecast-row[data-bucket] { cursor: pointer; transition: background 0.15s; }
  .forecast-row[data-bucket]:hover { background: var(--cream-soft); }
  .forecast-row.expanded { border-color: var(--taupe-deep); }

  /* Calendar day preview: expanded list of Latin terms scheduled */
  .day-preview {
    background: var(--cream);
    border: 1px solid var(--rule);
    border-top: 0;
    padding: 14px 18px 16px;
    margin-top: -6px;
    margin-bottom: 6px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  .day-preview.empty {
    color: var(--ink-soft);
    font-style: italic;
    text-align: center;
    padding: 14px 18px;
  }
  .day-preview-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px 14px;
  }
  .day-preview-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 1rem;
  }
  .day-preview-list .dp-lat {
    color: var(--burgundy);
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day-preview-list .dp-pos {
    font-family: 'Cinzel', serif;
    font-size: 0.56rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    flex-shrink: 0;
  }
  @media (max-width: 560px) {
    .day-preview-list { grid-template-columns: 1fr 1fr; gap: 4px 10px; }
    .day-preview-list li { font-size: 0.95rem; }
  }

  /* ─── Stats view + heatmap ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-grid .stat {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 16px 10px;
    text-align: center;
  }
  .stat-grid .stat .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .stat-grid .stat .lbl {
    margin-top: 4px;
    font-family: 'Cinzel', serif;
    font-size: 0.56rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .heatmap {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 18px 14px;
    margin-bottom: 18px;
  }
  .heatmap h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-dark);
    text-align: center;
    margin-bottom: 16px;
  }
  .heatmap-grid {
    display: grid;
    grid-template-rows: repeat(7, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: minmax(10px, 1fr);
    gap: 3px;
    overflow-x: auto;
  }
  .heatmap-cell {
    aspect-ratio: 1 / 1;
    background: var(--cream);
    border-radius: 2px;
  }
  .heatmap-cell[data-level="0"] { background: var(--cream); }
  .heatmap-cell[data-level="1"] { background: #ddd0bd; }
  .heatmap-cell[data-level="2"] { background: #b89a7a; }
  .heatmap-cell[data-level="3"] { background: #8a6442; }
  .heatmap-cell[data-level="4"] { background: var(--burgundy); }
  .heatmap-legend {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  .heatmap-legend .swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }

  .rating-breakdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .rating-breakdown .rb {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 12px 8px;
    text-align: center;
  }
  .rating-breakdown .rb .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 600;
  }
  .rating-breakdown .rb .lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: 4px;
  }
  .rating-breakdown .rb-1 .num { color: var(--burgundy); }
  .rating-breakdown .rb-2 .num { color: #8a6b22; }
  .rating-breakdown .rb-3 .num { color: var(--green); }
  .rating-breakdown .rb-4 .num { color: var(--taupe-deep); }

  /* ─── Profile setup + Leaderboard ─── */
  .profile-form { max-width: 480px; margin: 0 auto; }
  .profile-form .field { margin-bottom: 16px; }
  .profile-form label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-dark);
    margin-bottom: 6px;
  }
  .profile-form input,
  .profile-form select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: 'Lato', sans-serif;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    appearance: none;
    border-radius: 0;
  }
  .profile-form select:disabled { background: var(--cream); color: var(--taupe); }
  .profile-form .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .profile-form .help {
    margin-top: -6px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: var(--taupe-dark);
    line-height: 1.5;
  }
  .profile-msg {
    margin-top: 14px;
    padding: 10px 14px;
    font-size: 0.9rem;
    display: none;
  }

  .leaderboard-list { display: flex; flex-direction: column; gap: 6px; max-width: 720px; margin: 16px auto 0; }
  .lb-row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 14px;
    align-items: center;
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 18px;
  }
  .lb-row.you { border-color: var(--burgundy); background: var(--cream-soft); }
  .lb-rank {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--burgundy);
    text-align: center;
  }
  .lb-row.you .lb-rank { color: var(--burgundy); }
  .lb-rank-medal { font-size: 1.3rem; line-height: 1; }
  .lb-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink);
    line-height: 1.2;
  }
  .lb-name .you-tag {
    margin-left: 8px;
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--burgundy);
    background: var(--cream);
    padding: 2px 6px;
  }
  .lb-sub {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: 3px;
  }
  .lb-metric {
    text-align: right;
  }
  .lb-metric .num {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--burgundy);
    line-height: 1;
  }
  .lb-metric .lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: 3px;
  }
  .lb-empty {
    text-align: center;
    padding: 32px 20px;
    background: var(--cream);
    border: 1px solid var(--rule);
    font-size: 0.95rem;
    color: var(--taupe-dark);
    line-height: 1.6;
  }
  .lb-tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 18px 0 8px;
  }
  .lb-tab {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--taupe-dark);
    padding: 8px 16px;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .lb-tab.active { background: var(--burgundy); color: #fff; border-color: var(--burgundy); }

  /* ─── Mobile ─── */
  @media (max-width: 560px) {
    main { padding: 20px 14px 60px; }
    .card { padding: 40px 20px; min-height: 300px; }
    .rate-row { gap: 6px; }
    .rate-btn { padding: 12px 4px; min-height: 60px; font-size: 0.72rem; letter-spacing: 0.1em; }
    .rate-btn .interval-hint { font-size: 0.72rem; margin-top: 4px; }
    header.app-header { padding: 10px 56px 10px 14px; gap: 8px; }
    header.app-header .brand { font-size: 1.1rem; }
    header.app-header .user { display: none; }
    header.app-header nav { gap: 10px; font-size: 0.62rem; letter-spacing: 0.1em; }
    .forecast-summary, .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .rating-breakdown { grid-template-columns: repeat(2, 1fr); }

  /* ─── Dark mode (opt-in only) ───────────────────────────────────────
     LIGHT IS DEFAULT. Dark applies only when the user picks Dark from
     Settings (sets data-theme="dark" on <html>). OS prefers-color-scheme
     is not honoured -- see the landing page CSS for the rationale. */
  :root[data-theme="dark"] {
    --ink: #EAD9BC;
    --ink-soft: #C8B498;
    --cream: #211814;
    --cream-soft: #1A130F;
    --rule: #3D2F25;
    --taupe: #BFA388;
    --taupe-dark: #D9C2A4;
    --taupe-deep: #EAD9BC;
    --gold: #D4B57E;
    --burgundy: #6B3535;
    --green: #8FBFA0;
    --green-bright: #A8D4BA;
    --amber: #E0BA6B;
  }
  :root[data-theme="dark"] body { background: #0F0B08; }
  :root[data-theme="dark"] .card,
  :root[data-theme="dark"] .deck-card,
  :root[data-theme="dark"] .forecast-row,
  :root[data-theme="dark"] .day-preview,
  :root[data-theme="dark"] .stat,
  :root[data-theme="dark"] .lb-row,
  :root[data-theme="dark"] .lb-tabs { background: #1A130F; }
  :root[data-theme="dark"] .lb-tab.active { background: #6B3535; border-color: #6B3535; color: #EAD9BC; }
  /* ────────────────────────────────────────────────────────────────
     White-surface sweep: many surfaces had `background: #fff` hardcoded
     (the app header was the most visible -- cream text on white). All
     forced to warm dark in dark mode. The legacy var-only overrides
     above already handled .card/.deck-card/.forecast-row/.stat/.lb-row;
     this block catches the rest. */
  :root[data-theme="dark"] header.app-header { background: #1A130F; border-bottom-color: #3D2F25; }
  :root[data-theme="dark"] .settings-section { background: #1A130F; }
  :root[data-theme="dark"] .settings-btn,
  :root[data-theme="dark"] .oauth-btn { background: #211814; color: #EAD9BC; border-color: #3D2F25; }
  :root[data-theme="dark"] .settings-btn:hover,
  :root[data-theme="dark"] .oauth-btn:hover { background: #2A211A; }
  :root[data-theme="dark"] .goal-banner { background: #1A130F; }
  :root[data-theme="dark"] .goal-settings { background: #1A130F; }
  :root[data-theme="dark"] .target-chip { background: #211814; color: #EAD9BC; border-color: #3D2F25; }
  :root[data-theme="dark"] .target-chip.active { background: #2A211A; border-color: var(--gold); color: #EAD9BC; }
  :root[data-theme="dark"] .forecast-summary .stat { background: #1A130F; }
  :root[data-theme="dark"] .heatmap { background: #1A130F; }
  :root[data-theme="dark"] .rating-breakdown .rb { background: #211814; }
  :root[data-theme="dark"] .stat-grid .stat { background: #1A130F; }
  :root[data-theme="dark"] .rate-btn { background: #211814; color: #EAD9BC; }
  /* Rate-button per-rating colours had hardcoded light-mode values that
     stranded text on dark in dark mode. Brighten each one so the label
     reads against the dark card surface, and replace the pastel hover
     backgrounds with warm dark equivalents. */
  /* --burgundy in dark = #6B3535 (matches the CTA button bg). Too dark
     to read as text on the dark surface, so foreground uses get a

  :root[data-theme="dark"] .rate-btn[data-rating="1"] { border-color: #A85959; color: #D87878; }
  :root[data-theme="dark"] .rate-btn[data-rating="1"]:hover { background: #2E1A1A; }

  :root[data-theme="dark"] header.app-header nav a:hover,

  :root[data-theme="dark"] header.app-header nav a.active,

  :root[data-theme="dark"] .rate-btn[data-rating="2"]:hover { background: #2E2418; }
  :root[data-theme="dark"] .rate-btn[data-rating="3"] { border-color: #8FBFA0; color: #A8D4BA; }
  :root[data-theme="dark"] .rate-btn[data-rating="3"]:hover { background: #1E2A22; }

  :root[data-theme="dark"] .card-state-pill.cs-new { background: #2E2A22; color: #D9C2A4; }

  /* ─── Theme picker (settings tile) ──────────────────────────────── */

  /* ─── First-time onboarding tour ─────────────────────────────────── */
  .tour-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 11, 8, 0.62);
    z-index: 1000;

  .tour-card {
    background: var(--cream-soft);

  .tour-progress {
    margin-top: 12px;

    letter-spacing: 0.12em;
    color: var(--taupe);

  /* ─── Streak-freeze affordance on Stats page ─────────────────────── */
  .freeze-card {
    margin-top: 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;

  }

  }
  .freeze-card .freeze-text strong { color: var(--ink); font-weight: 600; }
  .freeze-card button {
    background: var(--burgundy);
    color: #fff;
    border: 0;
    padding: 9px 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
  }
  .freeze-card button:disabled { opacity: 0.4; cursor: default; }

  /* ─── Candle loading affordance (replaces plain "Loading...") ────── */
  .candle-load {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 40px 16px;
    color: var(--taupe);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
  }
  .candle-load svg { width: 28px; height: 56px; }
  .candle-load .flame { animation: flicker 1.4s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes flicker {
    0%, 100% { transform: scaleY(1) rotate(-1deg); opacity: 0.95; }
    50%      { transform: scaleY(1.08) rotate(1.5deg); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .candle-load .flame { animation: none; }
  }

  /* ───── Floating theme toggle (corner FAB) ──────────────────────────
     Matches the PatronAtlas pattern: fixed top-right circular Sun/Moon
     button. Writes tlm_theme to localStorage and flips data-theme on
     <html>. The Settings page picker reflects the same state when shown. */
  .theme-toggle-fab {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--cream-soft);
    border: 1px solid var(--gold);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    transition: background-color 0.18s, color 0.18s, transform 0.18s, border-color 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle-fab:hover { background: var(--cream); transform: scale(1.05); }
  .theme-toggle-fab:active { transform: scale(0.95); }
  .theme-toggle-fab svg { width: 20px; height: 20px; display: block; }
  .theme-toggle-fab .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle-fab {
    background: #1A130F;
    border-color: var(--gold);
    color: #EAD9BC;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="dark"] .theme-toggle-fab:hover { background: #221912; }
  :root[data-theme="dark"] .theme-toggle-fab .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle-fab .icon-moon { display: none; }
  @media (max-width: 560px) {
    .theme-toggle-fab { top: 10px; right: 10px; width: 36px; height: 36px; }
    .theme-toggle-fab svg { width: 16px; height: 16px; }
  }
</style>
</head>
<body>

<button id="themeToggleFab" class="theme-toggle-fab" type="button" aria-label="Switch to dark mode" title="Switch theme">

    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
</button>

<header class="app-header">

  <nav>

<main id="main">
  <div class="candle-load" id="loadingMsg">
    <svg viewBox="0 0 24 48" aria-hidden="true">
      <ellipse class="flame" cx="12" cy="9" rx="3.6" ry="6" fill="#D4B57E"/>
      <ellipse class="flame" cx="12" cy="10" rx="2" ry="3.4" fill="#8B4747"/>
      <rect x="9" y="15" width="6" height="2" fill="#4A3528"/>
      <rect x="8.5" y="17" width="7" height="28" rx="0.5" fill="#F0E6D2" stroke="#C8A871" stroke-width="0.5"/>
    </svg>
    <span>Lighting the candles&hellip;</span>
  </div>
</main>

<script>
  // IMPORTANT: when bumping APP_BUILD, also update app/version.json to match,
  // otherwise users on stale-cached HTML won't auto-reload.
  var APP_BUILD = 'v51-2026-05-20-feature-band-revert-and-links';
  console.info('[thelatinmass] app-' + APP_BUILD);

  // ─── Stale-cache auto-reload ───────────────────────────────────────────
  // GitHub Pages serves HTML with Cache-Control: max-age=600, so users can
  // sit on stale code for up to 10 min after a deploy. We fetch a tiny
  // version.json (cache-busted) on boot and silently reload with ?cb=...
  // if the server build is newer than the embedded one.
  //
  // LOOP GUARD: if APP_BUILD is ever forgotten on a version.json bump, a
  // naive "reload on mismatch" would loop forever (served HTML keeps the
  // old APP_BUILD, so it never matches). So: if the URL already carries
  // ?cb=<that exact build>, we have already reloaded once for it -- bail
  // and warn instead of reloading again. Legit deploys still bust once.
  (function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.build || d.build === APP_BUILD) return;
        var m = location.search.match(/[?&]cb=([^&]*)/);
        var cb = m ? decodeURIComponent(m[1]) : null;
        if (cb === d.build) {
          console.warn('[thelatinmass] APP_BUILD (' + APP_BUILD +
            ') is stale vs version.json (' + d.build +
            '); skipping reload to avoid a loop. Bump APP_BUILD to match.');
          return;
        }
        console.info('[thelatinmass] new build available:', d.build, '-- reloading');
        location.replace(location.pathname + '?cb=' + encodeURIComponent(d.build) + location.hash);
      })
      .catch(function () { /* network blip, ignore */ });
  })();

  var SUPABASE_URL = 'https://kugcbqfqataxbyjtaume.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_E90qtGbDdlijn20tF5nVZw_CMe7goVi';
  var REST = SUPABASE_URL + '/rest/v1';
  var AUTH = SUPABASE_URL + '/auth/v1';

  // ─── Auth bootstrapping ─────────────────────────────────────────────────
  // Reads tlm_session from localStorage, refreshes the access token if it's
  // expired (or about to be), and returns a usable session — or null if the
  // session is unrecoverable. Single in-flight refresh is shared via a
  // cached Promise so concurrent rest() calls don't all issue refresh requests.
  var _refreshInFlight = null;

  function readRawSession() {
    try {
      var raw = localStorage.getItem('tlm_session');
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.access_token || !s.user) return null;
      return s;
    } catch (_) { return null; }
  }

  function isExpiringSoon(s) {
    var expAt = s && s.expires_at ? s.expires_at * 1000 : 0;
    if (!expAt) return false;
    // Refresh if within 60 seconds of expiry (or already past it)
    return Date.now() >= expAt - 60000;
  }

  function refreshSession(s) {
    if (_refreshInFlight) return _refreshInFlight;
    if (!s || !s.refresh_token) {
      return Promise.resolve(null);
    }
    console.info('[tlm-app] refreshing access token');
    _refreshInFlight = fetch(AUTH + '/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (res) {
      if (res.ok && res.body && res.body.access_token) {
        // Supabase refresh response sometimes omits expires_at — derive from
        // expires_in if missing, so isExpiringSoon() works next time.
        if (!res.body.expires_at && res.body.expires_in) {
          res.body.expires_at = Math.floor(Date.now() / 1000) + res.body.expires_in;
        }
        // Preserve user object across refresh (some refresh responses elide it)
        if (!res.body.user && s.user) res.body.user = s.user;
        localStorage.setItem('tlm_session', JSON.stringify(res.body));
        console.info('[tlm-app] refresh ok, new expiry:', new Date(res.body.expires_at * 1000).toISOString());
        return res.body;
      }
      console.warn('[tlm-app] refresh failed:', res.body);
      return null;
    }).catch(function (e) {
      console.warn('[tlm-app] refresh threw:', e);
      return null;
    }).finally(function () {
      _refreshInFlight = null;
    });
    return _refreshInFlight;
  }

  // Returns a usable session (refreshed if needed) or null. Awaitable.
  function loadSession() {
    var s = readRawSession();
    if (!s) return Promise.resolve(null);
    if (!isExpiringSoon(s)) return Promise.resolve(s);
    return refreshSession(s);
  }

  function redirectToLanding() { location.href = '../'; }

  function signOut() {
    var s = readRawSession();
    if (s && s.access_token) {
      fetch(AUTH + '/logout', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + s.access_token,
        },
      }).catch(function () {});
    }
    localStorage.removeItem('tlm_session');
    redirectToLanding();
  }
  document.getElementById('signoutBtn').addEventListener('click', signOut);

  // ─── Floating theme toggle (Sun/Moon corner FAB) ────────────────────
  // Click to flip light <-> dark. Light is default; only 'dark' is ever
  // written to localStorage. The Settings page picker reads the same key.
  (function () {
    var btn = document.getElementById('themeToggleFab');
    if (!btn) return;
    function syncLabel() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    syncLabel();
    btn.addEventListener('click', function () {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      try {
        if (isDark) localStorage.removeItem('tlm_theme');
        else localStorage.setItem('tlm_theme', 'dark');
      } catch (_) {}
      if (isDark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
      // If the Settings picker is currently rendered, mirror the new state.
      document.querySelectorAll('.theme-btn[data-theme]').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-theme') === (isDark ? 'light' : 'dark'));
      });
      syncLabel();
      if (typeof window.tlmTrack === 'function') window.tlmTrack('theme_toggle', { to: isDark ? 'light' : 'dark' });
    });
  })();

  // ─── Supabase REST helpers (with user JWT) ──────────────────────────────
  function authHeaders(session) {
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
  }
  // rest() — issues a PostgREST request with the current session's JWT.
  // On 401 it transparently refreshes the token and retries once, so a study
  // session that crosses the 1h access-token boundary doesn't fall over.
  function rest(path, session, opts) {
    opts = opts || {};
    var extraHeaders = opts.headers || {};
    function exec(sess) {
      return fetch(REST + path, {
        method: opts.method || 'GET',
        headers: Object.assign({}, authHeaders(sess), extraHeaders),
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      }).then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = t ? JSON.parse(t) : null; } catch (_) {}
          return { ok: r.ok, status: r.status, body: j };
        });
      });
    }
    return exec(session).then(function (res) {
      if (res.status === 401 && !opts._retried) {
        return refreshSession(readRawSession()).then(function (newSess) {
          if (!newSess) {
            throw new Error('Session expired. Please sign in again.');
          }
          SESSION = newSess;
          opts._retried = true;
          return exec(newSess).then(function (r2) {
            if (!r2.ok) {
              var m = (r2.body && (r2.body.message || r2.body.error)) || ('HTTP ' + r2.status);
              throw new Error(m);
            }
            return r2.body;
          });
        });
      }
      if (!res.ok) {
        var msg = (res.body && (res.body.message || res.body.error || res.body.error_description)) || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      return res.body;
    });
  }

  // ─── State ──────────────────────────────────────────────────────────────
  var STATIC = null;
  var SESSION = null;
  var PROFILE = null;          // row from public.profiles for the signed-in user
  var ARCHDIOCESES = null;     // { countries: [{ code, name, archdioceses: [...] }] }
  var USER_STATE = {}; // card_id -> { due, stability, difficulty, reps, lapses, state, last_review }
  var ACTIVE_DECK = null;
  var QUEUE = [];
  var CURRENT = null;
  var CURRENT_FLIPPED = false;
  var IMAGE_PEEKED = false;
  // Undo history. Each entry is {card, prevUserState} captured BEFORE that
  // card was rated. "Previous" pops the top, restores card + state, lets the
  // user re-rate (overwrites the prior upsert).
  var HISTORY = [];
  var HISTORY_MAX = 50;
  // Two daily caps + today-only override, all kept in a single SETTINGS
  // object that mirrors profiles.settings JSONB in Supabase. localStorage
  // is just a cache so getters never block. Cross-device sync: on boot
  // we fetch from Supabase and overwrite the cache; setters write to both
  // cache (instant) and Supabase (debounced).
  //
  //   NEW_PER_DAY = how many BRAND-NEW cards to introduce per day (intake)
  //   MAX_PER_DAY = total cards per day, INCLUDING due reviews (the goal)
  //   extra_today = today-only override, per-date map; auto-clears at midnight
  //
  // MAX is always forced >= NEW so it can't be nonsensical.
  var NEW_PER_DAY_DEFAULT = 10;
  var MAX_PER_DAY_DEFAULT = 30;
  var SETTINGS_CACHE_KEY = 'tlm_settings';
  var SETTINGS = readSettingsFromCache();
  var _settingsSaveTimer = null;
  var _settingsSyncInFlight = false;

  function readSettingsFromCache() {
    try {
      var raw = localStorage.getItem(SETTINGS_CACHE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') return normaliseSettings(parsed);
      }
    } catch (_) {}
    // Legacy localStorage keys (pre-sync) — migrate them on first run.
    var legacy = {};
    try {
      var lnpd = parseInt(localStorage.getItem('tlm_new_per_day'), 10);
      if (isFinite(lnpd)) legacy.new_per_day = lnpd;
      var lmpd = parseInt(localStorage.getItem('tlm_max_per_day'), 10);
      if (isFinite(lmpd)) legacy.max_per_day = lmpd;
    } catch (_) {}
    return normaliseSettings(legacy);
  }

  function normaliseSettings(s) {
    s = s || {};
    var np = parseInt(s.new_per_day, 10);
    if (!isFinite(np) || np < 1 || np > 100) np = NEW_PER_DAY_DEFAULT;
    var mp = parseInt(s.max_per_day, 10);
    if (!isFinite(mp) || mp < 1 || mp > 500) mp = MAX_PER_DAY_DEFAULT;
    if (mp < np) mp = np;
    var ex = (s.extra_today && typeof s.extra_today === 'object') ? s.extra_today : {};
    // Card-render toggles. Default ON so existing users keep current behaviour.
    var pa = (typeof s.play_audio === 'boolean') ? s.play_audio : true;
    var si = (typeof s.show_images === 'boolean') ? s.show_images : true;
    return {
      new_per_day: np,
      max_per_day: mp,
      extra_today: ex,
      play_audio: pa,
      show_images: si,
    };
  }

  function persistSettings() {
    try { localStorage.setItem(SETTINGS_CACHE_KEY, JSON.stringify(SETTINGS)); } catch (_) {}
    // Debounce remote writes so a flurry of chip clicks coalesces into one
    // PATCH instead of N. 400ms is short enough to be invisible.
    if (_settingsSaveTimer) clearTimeout(_settingsSaveTimer);
    _settingsSaveTimer = setTimeout(saveSettingsRemote, 400);
  }

  function saveSettingsRemote() {
    if (!SESSION || !SESSION.user || !SESSION.user.id) return;
    if (_settingsSyncInFlight) {
      // Another save was in flight; reschedule.
      _settingsSaveTimer = setTimeout(saveSettingsRemote, 400);
      return;
    }
    _settingsSyncInFlight = true;
    rest('/profiles?user_id=eq.' + SESSION.user.id, SESSION, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: { settings: SETTINGS },
    }).catch(function (err) {
      console.warn('[tlm-app] settings sync failed (will retry on next change):', err && err.message);
    }).then(function () {
      _settingsSyncInFlight = false;
    });
  }

  function fetchSettingsRemote() {
    if (!SESSION || !SESSION.user || !SESSION.user.id) return Promise.resolve();
    return rest('/profiles?select=settings&user_id=eq.' + SESSION.user.id, SESSION)
      .then(function (rows) {
        if (rows && rows.length && rows[0] && rows[0].settings && typeof rows[0].settings === 'object') {
          // If remote is non-empty, it wins. If empty, push local cache up so
          // a fresh signup on device B picks up the choices made on device A.
          var keys = Object.keys(rows[0].settings || {});
          if (keys.length > 0) {
            SETTINGS = normaliseSettings(rows[0].settings);
            try { localStorage.setItem(SETTINGS_CACHE_KEY, JSON.stringify(SETTINGS)); } catch (_) {}
          } else {
            saveSettingsRemote();
          }
        }
      })
      .catch(function (err) { console.warn('[tlm-app] settings fetch failed:', err && err.message); });
  }

  function getDailyTarget() { return SETTINGS.new_per_day; }
  function setDailyTarget(n) {
    n = Math.max(1, Math.min(100, parseInt(n, 10) || NEW_PER_DAY_DEFAULT));
    SETTINGS.new_per_day = n;
    if (SETTINGS.max_per_day < n) SETTINGS.max_per_day = n;
    persistSettings();
    return n;
  }
  function getMaxPerDay() {
    var mp = SETTINGS.max_per_day;
    return Math.max(mp, SETTINGS.new_per_day);
  }
  function setMaxPerDay(n) {
    n = Math.max(1, Math.min(500, parseInt(n, 10) || MAX_PER_DAY_DEFAULT));
    if (n < SETTINGS.new_per_day) n = SETTINGS.new_per_day;
    SETTINGS.max_per_day = n;
    persistSettings();
    return n;
  }

  // Today-only override is keyed per-date inside SETTINGS.extra_today.
  // Old dates linger but never affect any computation.
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getExtraToday() {
    var v = SETTINGS.extra_today && SETTINGS.extra_today[todayKey()];
    return (typeof v === 'number' && isFinite(v) && v >= 0) ? v : 0;
  }
  function addExtraToday(n) {
    var next = getExtraToday() + Math.max(0, parseInt(n, 10) || 0);
    if (!SETTINGS.extra_today) SETTINGS.extra_today = {};
    SETTINGS.extra_today[todayKey()] = next;
    persistSettings();
    return next;
  }

  // Resolve the session async (will refresh if expired), then either run the
  // app or show a "session expired" screen. We never silently redirect away
  // from /app/ — that looked like a "click and refresh" bug to the user.
  loadSession().then(function (session) {
    SESSION = session;
    if (!SESSION) {

    boot();

    console.info('[tlm-app] boot ok, user:', SESSION.user && SESSION.user.email);
    document.getElementById('userEmail').textContent = (SESSION.user && SESSION.user.email) || '';
    wireNav();
    Promise.all([fetchStatic(), fetchUserState(), fetchSettingsRemote(), fetchProfile(), fetchArchdioceses()])
      .then(function () { showDeckPicker(); })
      .catch(function (err) {
        // 401 from fetchUserState would already have triggered a refresh+retry
        // inside rest(). If we still get here it's a hard failure — show it.
        showErr('Failed to load: ' + (err.message || err));

    wireVisibilityRefresh();

  // When the tab comes back to the foreground after being hidden for >60s,
  // resync card state + settings so the user doesn't see stale numbers from
  // a study session that happened on a different device. The threshold
  // avoids hammering the API on quick app-switches.
  var _lastHiddenAt = 0;
  function wireVisibilityRefresh() {
    if (typeof document.addEventListener !== 'function') return;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        _lastHiddenAt = Date.now();
        return;
      }
      if (!SESSION) return;
      var awayMs = Date.now() - _lastHiddenAt;
      if (_lastHiddenAt === 0 || awayMs < 60000) return; // skip short blips
      console.info('[tlm-app] tab back after', Math.round(awayMs/1000) + 's away, resyncing');
      Promise.all([fetchUserState(), fetchSettingsRemote()]).then(function () {
        // Re-render the current view so updated numbers land immediately.
        var rerender = ({
          decks: showDeckPicker,
          calendar: function () { showCalendar(); },
          stats: function () { showStats(); },
        })[ACTIVE_VIEW];
        if (rerender) rerender();
      }).catch(function (err) {
        console.warn('[tlm-app] resync failed:', err && err.message);
      });
    });
  }

    var form = document.getElementById('reauthForm');

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.style.display = 'block';
      msg.style.background = kind === 'error' ? '#f8e8e8' : '#e6efe9';
      msg.style.border = '1px solid ' + (kind === 'error' ? '#c08383' : '#7da090');
      msg.style.color = kind === 'error' ? 'var(--burgundy)' : 'var(--green)';
    }

    form.addEventListener('submit', function (e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (inFlight) return;
      inFlight = true;
      try { document.activeElement && document.activeElement.blur(); } catch (_) {}
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      msg.style.display = 'none';

      var email = (emailEl.value || '').trim();
      var password = pwEl.value;
      if (!email || email.indexOf('@') === -1) {
        showMsg('Please enter a valid email address.', 'error');
        btn.disabled = false; inFlight = false; return;
      }
      if (!password || password.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error');
        btn.disabled = false; inFlight = false; return;
      }

      fetch(AUTH + '/token?grant_type=password', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      }).then(function (res) {
        if (!res.ok) {
          var em = (res.body && (res.body.msg || res.body.error_description || res.body.error)) || 'Sign-in failed';
          showMsg(em, 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
          return;
        }
        if (res.body && res.body.access_token) {
          try { localStorage.setItem('tlm_session', JSON.stringify(res.body)); } catch (_) {}
          showMsg('Signed in. Loading your decks…', 'success');
          // Reload the page so /app/ boots cleanly with the new session.
          setTimeout(function () { window.location.reload(); }, 400);
        } else {
          showMsg('Sign-in succeeded but no session was returned. Try again.', 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
        }
      }).catch(function (err) {
        showMsg((err && err.message) || 'Network error. Try again.', 'error');
        btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
      });
    });

    // OAuth buttons: redirect to Supabase /authorize, which sends the user

    // hash. The landing page's callback IIFE parses that and bounces into
    // /app/. No JS-side token handling needed here.
    document.querySelectorAll('#main [data-oauth]').forEach(function (oauthBtn) {

          + '&redirect_to=' + redirectTo;
      });
    });
  }

  function fetchStatic() {
    // Cache-bust by build version so a phone running an older app HTML never
    // gets stuck pairing it with stale static.json (or vice versa).
    return fetch('./static.json?v=' + APP_BUILD).then(function (r) {
      if (!r.ok) throw new Error('Could not load card data (HTTP ' + r.status + ')');
      return r.json();
    }).then(function (data) {
      STATIC = data;
      // Index notes and cards by id for fast lookup
      STATIC.notesById = {};
      data.notes.forEach(function (n) { STATIC.notesById[n.id] = n; });
      STATIC.cardsByDeck = {};
      data.cards.forEach(function (c) {
        if (!STATIC.cardsByDeck[c.deck_id]) STATIC.cardsByDeck[c.deck_id] = [];
        STATIC.cardsByDeck[c.deck_id].push(c);
      });
      // Sort each deck's cards by note frequency desc (most common first)
      Object.keys(STATIC.cardsByDeck).forEach(function (deckId) {
        STATIC.cardsByDeck[deckId].sort(function (a, b) {
          var na = STATIC.notesById[a.note_id];
          var nb = STATIC.notesById[b.note_id];
          var fa = (na && na.frequency) || 0;
          var fb = (nb && nb.frequency) || 0;
          if (fb !== fa) return fb - fa;
          return a.id - b.id;
        });
      });
    });
  }

  function fetchUserState() {
    return rest('/user_card_state?select=card_id,due,stability,difficulty,reps,lapses,state,last_review,scheduled_days&limit=10000', SESSION).then(function (rows) {
      USER_STATE = {};
      (rows || []).forEach(function (r) { USER_STATE[r.card_id] = r; });
    });
  }
