<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>The Latin Mass — Study</title>
<meta name="description" content="Spaced-repetition flashcards for the 1962 Tridentine Latin Mass.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<link rel="preconnect" href="https://kugcbqfqataxbyjtaume.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Cinzel:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #2A2520;
    --ink-soft: #5A5048;
    --cream: #F7F2EA;
    --cream-soft: #FBF8F2;
    --rule: #E2D9CB;
    --taupe: #987F71;
    --taupe-dark: #7A6357;
    --taupe-deep: #5C4A40;
    --gold: #C8A871;
    --burgundy: #5E2A2A;
    --slider-cream: #E8DAC4;
    --green: #4a6e5a;
    --green-bright: #5d8a72;
    --amber: #b8862e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Lato', system-ui, sans-serif;
    font-weight: 300;
    color: var(--ink);
    background: var(--cream-soft);
    line-height: 1.65;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    line-height: 1.2;
    color: var(--ink);
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
    font-weight: 500;
  }

  /* ─── Header ─── */
  header.app-header {
    background: #fff;
    border-bottom: 1px solid var(--rule);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header.app-header .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--ink);
    font-weight: 500;
    text-decoration: none;
  }
  header.app-header .brand em { font-style: italic; color: var(--taupe-deep); }
  header.app-header nav {
    display: flex;
    gap: 16px;
    align-items: center;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  header.app-header nav a, header.app-header nav button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 4px;
    font: inherit;
  }
  header.app-header nav a:hover, header.app-header nav button:hover { color: var(--burgundy); }
  header.app-header .user { color: var(--taupe); font-family: 'Lato', sans-serif; font-size: 0.78rem; letter-spacing: 0; text-transform: none; }

  /* ─── Layout ─── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ─── Loading / status ─── */
  .status-msg {
    text-align: center;
    padding: 64px 20px;
    color: var(--taupe-dark);
    font-style: italic;
  }
  .err-msg {
    color: var(--burgundy);
    background: #f8e8e8;
    border: 1px solid var(--burgundy);
    padding: 14px 18px;
    margin: 16px 0;
    border-radius: 2px;
    font-size: 0.95rem;
  }

  /* ─── Deck picker ─── */
  .deck-picker { padding: 16px 0; }
  .deck-picker h2 {
    font-size: clamp(1.7rem, 3vw, 2.3rem);
    text-align: center;
    margin-bottom: 8px;
  }
  .deck-picker p.lede {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }
  .deck-list { display: flex; flex-direction: column; gap: 16px; }
  .deck-card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 24px 24px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, transform 0.15s;
    font-family: inherit;
    width: 100%;
  }
  .deck-card:hover { border-color: var(--taupe); }
  .deck-card:active { transform: scale(0.99); }
  .deck-card h3 {
    font-size: 1.5rem;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .deck-card p { color: var(--ink-soft); font-size: 0.95rem; }
  .deck-card .stats {
    margin-top: 12px;
    display: flex;
    gap: 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  .deck-card .stats .num { color: var(--burgundy); font-weight: 600; }

  /* ─── Card view ─── */
  .card-section { display: flex; flex-direction: column; gap: 24px; }
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--taupe);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .progress button {
    background: transparent;
    border: 0;
    color: var(--taupe-dark);
    cursor: pointer;
    font: inherit;
    padding: 8px 4px;
  }
  .progress button:hover { color: var(--burgundy); }
  .card {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 56px 32px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 18px;
  }
  .card .prompt-label {
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  /* Interlinear English gloss: red italic sitting just above the Latin,
     same convention as a hand-missal's bilingual layout. */
  .card .interlinear {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    line-height: 1.35;
    color: #B33A3A;
    margin: 4px 0 -4px;
    max-width: 100%;
    word-wrap: break-word;
  }
  .card .front {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 500;
    color: var(--burgundy);
    line-height: 1.15;
    max-width: 100%;
    word-wrap: break-word;
  }
  .card .back {
    margin-top: 12px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    width: 100%;
  }
  .card .back .english {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .card .back .meta {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .card .back .meta .pos {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-right: 8px;
  }
  .card .back .forms {
    margin-top: 10px;
    font-family: 'Lato', monospace, sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    word-spacing: 0.1em;
  }
  .card .back .role {
    font-style: italic;
    color: var(--taupe);
    font-size: 0.9rem;
    margin-top: 8px;
  }

  /* ─── Card media (image + audio) ─── */
  .card .back .card-image {
    margin: -8px 0 18px;
    display: flex;
    justify-content: center;
  }
  .card .back .card-image img {
    max-width: 100%;
    max-height: 320px;
    width: auto;
    height: auto;
    border: 1px solid var(--rule);
    background: var(--cream);
  }
  .card .back .card-audio {
    margin: 6px 0 14px;
    display: flex;
    justify-content: center;
  }
  .audio-btn {
    background: var(--cream);
    border: 1px solid var(--rule);
    color: var(--taupe-deep);
    padding: 6px 14px 6px 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, color 0.15s;
  }
  .audio-btn:hover { border-color: var(--burgundy); color: var(--burgundy); }
  .audio-btn svg { display: block; }

  /* ─── Buttons ─── */
  .reveal-btn {
    background: var(--burgundy);
    color: #fff;
    border: 1px solid var(--burgundy);
    padding: 14px 28px;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    min-height: 48px;
    transition: background 0.2s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reveal-btn:hover, .reveal-btn:active { background: var(--taupe-deep); border-color: var(--taupe-deep); }

  .rate-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .rate-btn {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 8px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 56px;
    color: var(--ink);
    transition: all 0.18s;
    appearance: none;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .rate-btn:hover, .rate-btn:active { transform: translateY(-1px); }
  .rate-btn .interval-hint {
    font-family: 'Lato', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--taupe);
    font-weight: 300;
  }
  .rate-btn[data-rating="1"] { border-color: #c08383; color: var(--burgundy); }
  .rate-btn[data-rating="1"]:hover { background: #f8e8e8; }
  .rate-btn[data-rating="2"] { border-color: var(--amber); color: #8a6b22; }
  .rate-btn[data-rating="2"]:hover { background: #f9eed5; }
  .rate-btn[data-rating="3"] { border-color: var(--green); color: var(--green); }
  .rate-btn[data-rating="3"]:hover { background: #e6efe9; }
  .rate-btn[data-rating="4"] { border-color: var(--taupe); color: var(--taupe-deep); }
  .rate-btn[data-rating="4"]:hover { background: #f3eee5; }

  /* ─── Done ─── */
  .done {
    text-align: center;
    padding: 48px 20px;
    background: #fff;
    border: 1px solid var(--rule);
  }
  .done h2 { font-size: 2rem; color: var(--burgundy); margin-bottom: 8px; }
  .done p { color: var(--ink-soft); margin-bottom: 24px; }

  /* ─── Nav active state ─── */
  header.app-header nav a.active,
  header.app-header nav button.active { color: var(--burgundy); border-bottom: 2px solid var(--burgundy); }

  /* ─── Calendar / forecast view ─── */
  .view-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .view-header h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); margin-bottom: 8px; }
  .view-header .lede { color: var(--ink-soft); font-size: 0.95rem; }

  .forecast-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .forecast-summary .stat {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 18px 12px;
    text-align: center;
  }
  .forecast-summary .stat .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .forecast-summary .stat .lbl {
    margin-top: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .forecast-list { display: flex; flex-direction: column; gap: 6px; }
  .forecast-row {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .forecast-row.today { border-color: var(--burgundy); }
  .forecast-row .day {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink);
  }
  .forecast-row .day .sub {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-left: 8px;
  }
  .forecast-row .bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--cream);
    margin: 0 14px;
    position: relative;
  }
  .forecast-row .bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--burgundy);
  }
  .forecast-row .count {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--burgundy);
    font-weight: 600;
    min-width: 32px;
    text-align: right;
  }
  .forecast-row.empty .count { color: var(--taupe); font-weight: 400; }

  /* ─── Stats view + heatmap ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-grid .stat {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 16px 10px;
    text-align: center;
  }
  .stat-grid .stat .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    color: var(--burgundy);
    font-weight: 600;
    line-height: 1;
  }
  .stat-grid .stat .lbl {
    margin-top: 4px;
    font-family: 'Cinzel', serif;
    font-size: 0.56rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }

  .heatmap {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 18px 14px;
    margin-bottom: 18px;
  }
  .heatmap h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--taupe-dark);
    text-align: center;
    margin-bottom: 16px;
  }
  .heatmap-grid {
    display: grid;
    grid-template-rows: repeat(7, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: minmax(10px, 1fr);
    gap: 3px;
    overflow-x: auto;
  }
  .heatmap-cell {
    aspect-ratio: 1 / 1;
    background: var(--cream);
    border-radius: 2px;
  }
  .heatmap-cell[data-level="0"] { background: var(--cream); }
  .heatmap-cell[data-level="1"] { background: #ddd0bd; }
  .heatmap-cell[data-level="2"] { background: #b89a7a; }
  .heatmap-cell[data-level="3"] { background: #8a6442; }
  .heatmap-cell[data-level="4"] { background: var(--burgundy); }
  .heatmap-legend {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 12px;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
  }
  .heatmap-legend .swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }

  .rating-breakdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .rating-breakdown .rb {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 12px 8px;
    text-align: center;
  }
  .rating-breakdown .rb .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 600;
  }
  .rating-breakdown .rb .lbl {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: 4px;
  }
  .rating-breakdown .rb-1 .num { color: var(--burgundy); }
  .rating-breakdown .rb-2 .num { color: #8a6b22; }
  .rating-breakdown .rb-3 .num { color: var(--green); }
  .rating-breakdown .rb-4 .num { color: var(--taupe-deep); }

  /* ─── Mobile ─── */
  @media (max-width: 560px) {
    main { padding: 20px 14px 60px; }
    .card { padding: 40px 20px; min-height: 300px; }
    .rate-row { gap: 6px; }
    .rate-btn { padding: 12px 4px; min-height: 60px; font-size: 0.66rem; letter-spacing: 0.1em; }
    .rate-btn .interval-hint { font-size: 0.6rem; }
    header.app-header { padding: 10px 14px; gap: 8px; }
    header.app-header .brand { font-size: 1.1rem; }
    header.app-header .user { display: none; }
    header.app-header nav { gap: 10px; font-size: 0.62rem; letter-spacing: 0.1em; }
    .forecast-summary, .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .rating-breakdown { grid-template-columns: repeat(2, 1fr); }
    .forecast-row { padding: 10px 12px; flex-wrap: wrap; }
    .forecast-row .bar-wrap { order: 3; flex-basis: 100%; margin: 8px 0 0; }
    .heatmap-grid { grid-auto-columns: minmax(8px, 1fr); gap: 2px; }
    .card .back .card-image img { max-height: 240px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <a href="../" class="brand">The <em>Latin Mass</em></a>
  <nav>
    <button id="navDecks" class="nav-link" data-view="decks">Decks</button>
    <button id="navCalendar" class="nav-link" data-view="calendar">Calendar</button>
    <button id="navStats" class="nav-link" data-view="stats">Stats</button>
    <span class="user" id="userEmail"></span>
    <button id="signoutBtn">Sign out</button>
  </nav>
</header>

<main id="main">
  <div class="status-msg" id="loadingMsg">Loading…</div>
</main>

<script>
  console.info('[thelatinmass] app-v6-2026-05-10-interlinear-single-direction');

  var SUPABASE_URL = 'https://kugcbqfqataxbyjtaume.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_E90qtGbDdlijn20tF5nVZw_CMe7goVi';
  var REST = SUPABASE_URL + '/rest/v1';
  var AUTH = SUPABASE_URL + '/auth/v1';

  // ─── Auth bootstrapping ─────────────────────────────────────────────────
  // Reads tlm_session from localStorage, refreshes the access token if it's
  // expired (or about to be), and returns a usable session — or null if the
  // session is unrecoverable. Single in-flight refresh is shared via a
  // cached Promise so concurrent rest() calls don't all issue refresh requests.
  var _refreshInFlight = null;

  function readRawSession() {
    try {
      var raw = localStorage.getItem('tlm_session');
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.access_token || !s.user) return null;
      return s;
    } catch (_) { return null; }
  }

  function isExpiringSoon(s) {
    var expAt = s && s.expires_at ? s.expires_at * 1000 : 0;
    if (!expAt) return false;
    // Refresh if within 60 seconds of expiry (or already past it)
    return Date.now() >= expAt - 60000;
  }

  function refreshSession(s) {
    if (_refreshInFlight) return _refreshInFlight;
    if (!s || !s.refresh_token) {
      return Promise.resolve(null);
    }
    console.info('[tlm-app] refreshing access token');
    _refreshInFlight = fetch(AUTH + '/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (res) {
      if (res.ok && res.body && res.body.access_token) {
        // Supabase refresh response sometimes omits expires_at — derive from
        // expires_in if missing, so isExpiringSoon() works next time.
        if (!res.body.expires_at && res.body.expires_in) {
          res.body.expires_at = Math.floor(Date.now() / 1000) + res.body.expires_in;
        }
        // Preserve user object across refresh (some refresh responses elide it)
        if (!res.body.user && s.user) res.body.user = s.user;
        localStorage.setItem('tlm_session', JSON.stringify(res.body));
        console.info('[tlm-app] refresh ok, new expiry:', new Date(res.body.expires_at * 1000).toISOString());
        return res.body;
      }
      console.warn('[tlm-app] refresh failed:', res.body);
      return null;
    }).catch(function (e) {
      console.warn('[tlm-app] refresh threw:', e);
      return null;
    }).finally(function () {
      _refreshInFlight = null;
    });
    return _refreshInFlight;
  }

  // Returns a usable session (refreshed if needed) or null. Awaitable.
  function loadSession() {
    var s = readRawSession();
    if (!s) return Promise.resolve(null);
    if (!isExpiringSoon(s)) return Promise.resolve(s);
    return refreshSession(s);
  }

  function redirectToLanding() { location.href = '../'; }

  function signOut() {
    var s = readRawSession();
    if (s && s.access_token) {
      fetch(AUTH + '/logout', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + s.access_token,
        },
      }).catch(function () {});
    }
    localStorage.removeItem('tlm_session');
    redirectToLanding();
  }
  document.getElementById('signoutBtn').addEventListener('click', signOut);

  // ─── Supabase REST helpers (with user JWT) ──────────────────────────────
  function authHeaders(session) {
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
  }
  // rest() — issues a PostgREST request with the current session's JWT.
  // On 401 it transparently refreshes the token and retries once, so a study
  // session that crosses the 1h access-token boundary doesn't fall over.
  function rest(path, session, opts) {
    opts = opts || {};
    var extraHeaders = opts.headers || {};
    function exec(sess) {
      return fetch(REST + path, {
        method: opts.method || 'GET',
        headers: Object.assign({}, authHeaders(sess), extraHeaders),
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      }).then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = t ? JSON.parse(t) : null; } catch (_) {}
          return { ok: r.ok, status: r.status, body: j };
        });
      });
    }
    return exec(session).then(function (res) {
      if (res.status === 401 && !opts._retried) {
        return refreshSession(readRawSession()).then(function (newSess) {
          if (!newSess) {
            throw new Error('Session expired. Please sign in again.');
          }
          SESSION = newSess;
          opts._retried = true;
          return exec(newSess).then(function (r2) {
            if (!r2.ok) {
              var m = (r2.body && (r2.body.message || r2.body.error)) || ('HTTP ' + r2.status);
              throw new Error(m);
            }
            return r2.body;
          });
        });
      }
      if (!res.ok) {
        var msg = (res.body && (res.body.message || res.body.error || res.body.error_description)) || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      return res.body;
    });
  }

  // ─── State ──────────────────────────────────────────────────────────────
  var STATIC = null;
  var SESSION = null;
  var USER_STATE = {}; // card_id -> { due, stability, difficulty, reps, lapses, state, last_review }
  var ACTIVE_DECK = null;
  var QUEUE = [];
  var CURRENT = null;
  var CURRENT_FLIPPED = false;
  var REVIEW_START = 0;
  var SESSION_REVIEWS = 0;

  // ─── Boot ───────────────────────────────────────────────────────────────
  // Resolve the session async (will refresh if expired), then either run the
  // app or show a "session expired" screen. We never silently redirect away
  // from /app/ — that looked like a "click and refresh" bug to the user.
  loadSession().then(function (session) {
    SESSION = session;
    if (!SESSION) {
      showSignedOut();
      return;
    }
    boot();
  }).catch(function (err) {
    console.warn('[tlm-app] loadSession failed:', err);
    showSignedOut();
  });

  function boot() {
    console.info('[tlm-app] boot ok, user:', SESSION.user && SESSION.user.email);
    document.getElementById('userEmail').textContent = (SESSION.user && SESSION.user.email) || '';
    wireNav();
    Promise.all([fetchStatic(), fetchUserState()])
      .then(function () { showDeckPicker(); })
      .catch(function (err) {
        // 401 from fetchUserState would already have triggered a refresh+retry
        // inside rest(). If we still get here it's a hard failure — show it.
        showErr('Failed to load: ' + (err.message || err));
      });
  }

  // Track which top-level view is active so we can highlight the nav link.
  var ACTIVE_VIEW = 'decks';
  function setActiveView(v) {
    ACTIVE_VIEW = v;
    var ids = { decks: 'navDecks', calendar: 'navCalendar', stats: 'navStats' };
    Object.keys(ids).forEach(function (k) {
      var el = document.getElementById(ids[k]);
      if (!el) return;
      if (k === v) el.classList.add('active'); else el.classList.remove('active');
    });
  }

  function wireNav() {
    var byView = {
      decks: showDeckPicker,
      calendar: function () { showCalendar(); },
      stats: function () { showStats(); },
    };
    Object.keys(byView).forEach(function (k) {
      var btn = document.querySelector('[data-view="' + k + '"]');
      if (!btn) return;
      btn.addEventListener('click', function () { byView[k](); });
    });
  }

  function showSignedOut() {
    // Try to recover the email from the (now-stale) JWT so the form is
    // pre-filled — saves the user from typing it again.
    var prefillEmail = '';
    try {
      var raw = localStorage.getItem('tlm_session');
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.user && s.user.email) prefillEmail = s.user.email;
      }
    } catch (_) {}
    // Clear the stale session so landing shows the signup form (not the
    // "Continue to study" CTA) if the user navigates away.
    try { localStorage.removeItem('tlm_session'); } catch (_) {}

    var main = document.getElementById('main');
    main.innerHTML = '<div class="done" style="padding:36px 24px;text-align:left;max-width:420px;margin:0 auto">'
      + '<h2 style="text-align:center;margin-bottom:6px">Your session expired</h2>'
      + '<p style="text-align:center;margin-bottom:22px">Sign in again to pick up where you left off.</p>'
      + '<form id="reauthForm" action="javascript:void(0)" method="post" novalidate>'
        + '<label for="reauthEmail" style="display:block;font-family:\'Cinzel\',serif;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--taupe-dark);margin-bottom:6px">Email</label>'
        + '<input type="email" id="reauthEmail" name="email" required autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" value="' + escapeHtml(prefillEmail) + '" style="width:100%;padding:12px 14px;font-size:16px;font-family:\'Lato\',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);margin-bottom:14px">'
        + '<label for="reauthPw" style="display:block;font-family:\'Cinzel\',serif;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--taupe-dark);margin-bottom:6px">Password</label>'
        + '<input type="password" id="reauthPw" name="password" required minlength="8" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" style="width:100%;padding:12px 14px;font-size:16px;font-family:\'Lato\',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);margin-bottom:18px">'
        + '<button type="submit" id="reauthSubmit" class="reveal-btn">Sign in</button>'
        + '<div id="reauthMsg" role="status" aria-live="polite" style="display:none;margin-top:14px;padding:10px 14px;font-size:0.9rem"></div>'
      + '</form>'
      + '<p style="text-align:center;margin-top:18px;font-size:0.85rem;color:var(--taupe-dark)">Or <a href="../" style="color:var(--burgundy)">return to the home page</a> to use a sign-in provider.</p>'
      + '</div>';

    var form = document.getElementById('reauthForm');
    var emailEl = document.getElementById('reauthEmail');
    var pwEl = document.getElementById('reauthPw');
    var btn = document.getElementById('reauthSubmit');
    var msg = document.getElementById('reauthMsg');
    var inFlight = false;

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.style.display = 'block';
      msg.style.background = kind === 'error' ? '#f8e8e8' : '#e6efe9';
      msg.style.border = '1px solid ' + (kind === 'error' ? '#c08383' : '#7da090');
      msg.style.color = kind === 'error' ? 'var(--burgundy)' : 'var(--green)';
    }

    form.addEventListener('submit', function (e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (inFlight) return;
      inFlight = true;
      try { document.activeElement && document.activeElement.blur(); } catch (_) {}
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      msg.style.display = 'none';

      var email = (emailEl.value || '').trim();
      var password = pwEl.value;
      if (!email || email.indexOf('@') === -1) {
        showMsg('Please enter a valid email address.', 'error');
        btn.disabled = false; inFlight = false; return;
      }
      if (!password || password.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error');
        btn.disabled = false; inFlight = false; return;
      }

      fetch(AUTH + '/token?grant_type=password', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      }).then(function (res) {
        if (!res.ok) {
          var em = (res.body && (res.body.msg || res.body.error_description || res.body.error)) || 'Sign-in failed';
          showMsg(em, 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
          return;
        }
        if (res.body && res.body.access_token) {
          try { localStorage.setItem('tlm_session', JSON.stringify(res.body)); } catch (_) {}
          showMsg('Signed in. Loading your decks…', 'success');
          // Reload the page so /app/ boots cleanly with the new session.
          setTimeout(function () { window.location.reload(); }, 400);
        } else {
          showMsg('Sign-in succeeded but no session was returned. Try again.', 'error');
          btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
        }
      }).catch(function (err) {
        showMsg((err && err.message) || 'Network error. Try again.', 'error');
        btn.disabled = false; btn.removeAttribute('aria-busy'); inFlight = false;
      });
    });
  }

  function fetchStatic() {
    return fetch('./static.json').then(function (r) {
      if (!r.ok) throw new Error('Could not load card data (HTTP ' + r.status + ')');
      return r.json();
    }).then(function (data) {
      STATIC = data;
      // Index notes and cards by id for fast lookup
      STATIC.notesById = {};
      data.notes.forEach(function (n) { STATIC.notesById[n.id] = n; });
      STATIC.cardsByDeck = {};
      data.cards.forEach(function (c) {
        if (!STATIC.cardsByDeck[c.deck_id]) STATIC.cardsByDeck[c.deck_id] = [];
        STATIC.cardsByDeck[c.deck_id].push(c);
      });
      // Sort each deck's cards by note frequency desc (most common first)
      Object.keys(STATIC.cardsByDeck).forEach(function (deckId) {
        STATIC.cardsByDeck[deckId].sort(function (a, b) {
          var na = STATIC.notesById[a.note_id];
          var nb = STATIC.notesById[b.note_id];
          var fa = (na && na.frequency) || 0;
          var fb = (nb && nb.frequency) || 0;
          if (fb !== fa) return fb - fa;
          return a.id - b.id;
        });
      });
    });
  }

  function fetchUserState() {
    return rest('/user_card_state?select=card_id,due,stability,difficulty,reps,lapses,state,last_review,scheduled_days&limit=10000', SESSION).then(function (rows) {
      USER_STATE = {};
      (rows || []).forEach(function (r) { USER_STATE[r.card_id] = r; });
    });
  }

  // ─── Deck picker ────────────────────────────────────────────────────────
  function showDeckPicker() {
    setActiveView('decks');
    var main = document.getElementById('main');
    var html = '<div class="deck-picker">'
             + '<span class="eyebrow" style="text-align:center;display:block;margin-bottom:14px">Study</span>'
             + '<h2>Choose a deck</h2>'
             + '<p class="lede">Spaced-repetition for the 1962 Tridentine Latin Mass.</p>'
             + '<div class="deck-list">';
    STATIC.decks.forEach(function (d) {
      var cards = STATIC.cardsByDeck[d.id] || [];
      var dueCount = 0, newCount = 0, reviewCount = 0;
      var now = Date.now();
      cards.forEach(function (c) {
        var s = USER_STATE[c.id];
        if (!s) { newCount++; return; }
        var dueMs = new Date(s.due || s.last_review || 0).getTime();
        if (dueMs <= now) dueCount++;
        if (s.reps > 0) reviewCount++;
      });
      html += '<button class="deck-card" data-deck="' + d.id + '">'
            + '<h3>' + escapeHtml(d.name) + '</h3>'
            + '<p>' + escapeHtml(d.description || '') + '</p>'
            + '<div class="stats">'
              + '<span><span class="num">' + dueCount + '</span> due</span>'
              + '<span><span class="num">' + newCount + '</span> new</span>'
              + '<span><span class="num">' + cards.length + '</span> total</span>'
            + '</div>'
            + '</button>';
    });
    html += '</div></div>';
    main.innerHTML = html;
    main.querySelectorAll('.deck-card').forEach(function (btn) {
      btn.addEventListener('click', function () {
        startDeck(parseInt(btn.dataset.deck, 10));
      });
    });
  }

  // ─── Calendar (next 14 days due forecast) ───────────────────────────────
  function showCalendar() {
    setActiveView('calendar');
    var main = document.getElementById('main');
    if (!STATIC) { main.innerHTML = '<div class="status-msg">Loading…</div>'; return; }

    var DAY = 86400000;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayMs = today.getTime();

    // Bucket every card-state row by which day it's due (clamped to today
    // for anything overdue, then the next 14 days, then "later").
    var buckets = []; // { ms, label, sub, count, isToday }
    for (var i = 0; i < 14; i++) {
      var d = new Date(todayMs + i * DAY);
      buckets.push({
        ms: d.getTime(),
        label: weekday(d) + ', ' + monthDay(d),
        sub: i === 0 ? 'today' : (i === 1 ? 'tomorrow' : ''),
        count: 0,
        isToday: i === 0,
      });
    }
    var laterBucket = { ms: todayMs + 14 * DAY, label: '14+ days', sub: '', count: 0, isToday: false };
    var overdueCount = 0;
    var newCount = 0;
    var totalScheduled = 0;

    // Walk every card across both decks
    var allCards = [];
    Object.keys(STATIC.cardsByDeck).forEach(function (deckId) {
      allCards = allCards.concat(STATIC.cardsByDeck[deckId]);
    });

    allCards.forEach(function (c) {
      var s = USER_STATE[c.id];
      if (!s) { newCount++; return; }
      if (!s.due) { newCount++; return; }
      var dueMs = new Date(s.due).getTime();
      if (dueMs < todayMs) { overdueCount++; return; }
      totalScheduled++;
      // Find the bucket
      var idx = Math.floor((dueMs - todayMs) / DAY);
      if (idx < 0) idx = 0;
      if (idx < 14) buckets[idx].count++;
      else laterBucket.count++;
    });

    // Buckets that count overdue belong to "today" too — overdue is due now
    if (buckets.length) buckets[0].count += overdueCount;

    var maxCount = Math.max(1, buckets.reduce(function (m, b) { return Math.max(m, b.count); }, 0), laterBucket.count);

    var html = '<div class="view-header">'
             + '<span class="eyebrow">Forecast</span>'
             + '<h2>Next two weeks</h2>'
             + '<p class="lede">Cards scheduled to come due, day by day.</p>'
             + '</div>'
             + '<div class="forecast-summary">'
               + '<div class="stat"><div class="num">' + (overdueCount + buckets[0].count - overdueCount) + '</div><div class="lbl">Due today</div></div>'
               + '<div class="stat"><div class="num">' + newCount + '</div><div class="lbl">New cards</div></div>'
               + '<div class="stat"><div class="num">' + (totalScheduled + overdueCount) + '</div><div class="lbl">In rotation</div></div>'
             + '</div>'
             + '<div class="forecast-list">';
    buckets.forEach(function (b) {
      var pct = Math.round(100 * b.count / maxCount);
      html += '<div class="forecast-row' + (b.isToday ? ' today' : '') + (b.count === 0 ? ' empty' : '') + '">'
            + '<span class="day">' + escapeHtml(b.label)
              + (b.sub ? '<span class="sub">' + escapeHtml(b.sub) + '</span>' : '')
            + '</span>'
            + '<span class="bar-wrap"><span class="bar" style="width:' + pct + '%"></span></span>'
            + '<span class="count">' + b.count + '</span>'
            + '</div>';
    });
    if (laterBucket.count > 0) {
      var pct2 = Math.round(100 * laterBucket.count / maxCount);
      html += '<div class="forecast-row empty">'
            + '<span class="day">' + escapeHtml(laterBucket.label) + '</span>'
            + '<span class="bar-wrap"><span class="bar" style="width:' + pct2 + '%;background:var(--taupe)"></span></span>'
            + '<span class="count">' + laterBucket.count + '</span>'
            + '</div>';
    }
    html += '</div>';
    main.innerHTML = html;
  }

  // ─── Stats (heatmap, streak, retention, totals) ─────────────────────────
  function showStats() {
    setActiveView('stats');
    var main = document.getElementById('main');
    main.innerHTML = '<div class="status-msg">Loading stats…</div>';

    // Pull last 90 days of review log for heatmap + streak + retention
    var sinceISO = new Date(Date.now() - 90 * 86400000).toISOString();
    var path = '/user_review_log?select=review_time,rating&review_time=gte.' + encodeURIComponent(sinceISO)
             + '&order=review_time.asc&limit=20000';
    rest(path, SESSION).then(function (rows) {
      renderStats(rows || []);
    }).catch(function (err) {
      showErr('Failed to load stats: ' + (err.message || err));
    });
  }

  function renderStats(rows) {
    var main = document.getElementById('main');
    var DAY = 86400000;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayMs = today.getTime();

    // Bucket reviews by local-day key
    var byDay = {}; // 'YYYY-MM-DD' -> { total, again, hard, good, easy }
    rows.forEach(function (r) {
      var d = new Date(r.review_time);
      var key = isoDate(d);
      var b = byDay[key];
      if (!b) b = byDay[key] = { total: 0, again: 0, hard: 0, good: 0, easy: 0 };
      b.total++;
      if (r.rating === 1) b.again++;
      else if (r.rating === 2) b.hard++;
      else if (r.rating === 3) b.good++;
      else if (r.rating === 4) b.easy++;
    });

    // Streak: count consecutive days back from today with at least one review.
    var streak = 0;
    for (var i = 0; i < 365; i++) {
      var d = new Date(todayMs - i * DAY);
      var k = isoDate(d);
      if (byDay[k]) streak++;
      else if (i === 0) {
        // No review today yet — but if yesterday had reviews we say streak is
        // still alive, just not extended yet.
        var y = new Date(todayMs - DAY);
        if (byDay[isoDate(y)]) continue;
        else break;
      } else break;
    }

    // Retention rate over last 30 days = % rating >= 3 (Good/Easy)
    var ret_total = 0, ret_pass = 0;
    var thirtyAgo = todayMs - 30 * DAY;
    rows.forEach(function (r) {
      var t = new Date(r.review_time).getTime();
      if (t < thirtyAgo) return;
      ret_total++;
      if (r.rating >= 3) ret_pass++;
    });
    var retention = ret_total > 0 ? Math.round(100 * ret_pass / ret_total) : null;

    // Rating breakdown — last 30 days
    var rb = { 1: 0, 2: 0, 3: 0, 4: 0 };
    rows.forEach(function (r) {
      var t = new Date(r.review_time).getTime();
      if (t < thirtyAgo) return;
      if (rb[r.rating] !== undefined) rb[r.rating]++;
    });

    // Heatmap grid: 90 cells, one per day, oldest first so columns advance L→R.
    // Pad with leading empties so the rightmost column is "today" and rows are
    // weekdays (Sun=0 at top).
    var cells = [];
    for (var j = 89; j >= 0; j--) {
      var dt = new Date(todayMs - j * DAY);
      var key = isoDate(dt);
      var entry = byDay[key];
      var n = entry ? entry.total : 0;
      var level = n === 0 ? 0 : (n < 5 ? 1 : n < 15 ? 2 : n < 40 ? 3 : 4);
      cells.push({ key: key, n: n, level: level, dow: dt.getDay() });
    }
    // Pad the start so the first cell aligns to its weekday row
    var leadPad = cells[0].dow;
    var pads = [];
    for (var p = 0; p < leadPad; p++) {
      pads.push({ key: null, n: 0, level: 0, empty: true });
    }
    var allCells = pads.concat(cells);

    var totalLast30 = 0;
    Object.keys(byDay).forEach(function (k) {
      var t = new Date(k + 'T12:00:00').getTime();
      if (t >= thirtyAgo) totalLast30 += byDay[k].total;
    });

    var html = '<div class="view-header">'
             + '<span class="eyebrow">Practice</span>'
             + '<h2>Your last 90 days</h2>'
             + '<p class="lede">Reviews logged, ratings given, days in a row.</p>'
             + '</div>'
             + '<div class="stat-grid">'
               + '<div class="stat"><div class="num">' + rows.length + '</div><div class="lbl">Total reviews</div></div>'
               + '<div class="stat"><div class="num">' + totalLast30 + '</div><div class="lbl">Last 30 days</div></div>'
               + '<div class="stat"><div class="num">' + streak + '</div><div class="lbl">Day streak</div></div>'
               + '<div class="stat"><div class="num">' + (retention === null ? '—' : retention + '%') + '</div><div class="lbl">Retention</div></div>'
             + '</div>'
             + '<div class="heatmap">'
               + '<h3>Activity heatmap (90 days)</h3>'
               + '<div class="heatmap-grid">';
    allCells.forEach(function (c) {
      if (c.empty) {
        html += '<div class="heatmap-cell" data-level="0" style="visibility:hidden"></div>';
      } else {
        var title = c.key + ': ' + c.n + ' review' + (c.n === 1 ? '' : 's');
        html += '<div class="heatmap-cell" data-level="' + c.level + '" title="' + escapeHtml(title) + '"></div>';
      }
    });
    html += '</div>'
            + '<div class="heatmap-legend">'
              + '<span>Less</span>'
              + '<span class="swatch" style="background:var(--cream)"></span>'
              + '<span class="swatch" style="background:#ddd0bd"></span>'
              + '<span class="swatch" style="background:#b89a7a"></span>'
              + '<span class="swatch" style="background:#8a6442"></span>'
              + '<span class="swatch" style="background:var(--burgundy)"></span>'
              + '<span>More</span>'
            + '</div>'
          + '</div>';

    if (ret_total > 0) {
      html += '<div style="font-family:\'Cinzel\',serif;font-size:0.66rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--taupe-dark);margin:18px 0 10px">Last 30 days · rating breakdown</div>'
            + '<div class="rating-breakdown">'
              + '<div class="rb rb-1"><div class="num">' + rb[1] + '</div><div class="lbl">Again</div></div>'
              + '<div class="rb rb-2"><div class="num">' + rb[2] + '</div><div class="lbl">Hard</div></div>'
              + '<div class="rb rb-3"><div class="num">' + rb[3] + '</div><div class="lbl">Good</div></div>'
              + '<div class="rb rb-4"><div class="num">' + rb[4] + '</div><div class="lbl">Easy</div></div>'
            + '</div>';
    }

    main.innerHTML = html;
  }

  // ─── Date utils for calendar/stats ──────────────────────────────────────
  function isoDate(d) {
    var yr = d.getFullYear();
    var mo = String(d.getMonth() + 1).padStart(2, '0');
    var da = String(d.getDate()).padStart(2, '0');
    return yr + '-' + mo + '-' + da;
  }
  function weekday(d) {
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
  }
  function monthDay(d) {
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  // ─── Review session ─────────────────────────────────────────────────────
  function startDeck(deckId) {
    ACTIVE_DECK = STATIC.decks.find(function (d) { return d.id === deckId; });
    SESSION_REVIEWS = 0;
    buildQueue();
    nextCard();
  }

  function buildQueue() {
    // Queue rule: due review cards first (oldest due first), then new cards
    // by frequency (most common first), capped at 50 new per session.
    var now = Date.now();
    var due = [];
    var fresh = [];
    var cards = STATIC.cardsByDeck[ACTIVE_DECK.id] || [];
    cards.forEach(function (c) {
      var s = USER_STATE[c.id];
      if (!s) {
        fresh.push(c);
      } else if (s.reps > 0) {
        var dueMs = new Date(s.due).getTime();
        if (dueMs <= now) due.push({ card: c, dueMs: dueMs });
      }
    });
    due.sort(function (a, b) { return a.dueMs - b.dueMs; });
    QUEUE = due.map(function (e) { return e.card; }).concat(fresh.slice(0, 50));
  }

  function nextCard() {
    if (QUEUE.length === 0) {
      showDone();
      return;
    }
    CURRENT = QUEUE.shift();
    CURRENT_FLIPPED = false;
    REVIEW_START = Date.now();
    renderCard();
  }

  function renderCard() {
    var note = STATIC.notesById[CURRENT.note_id];
    // We only ship Latin -> English now. Always show Latin as the prompt
    // and English as the small interlinear gloss revealed on flip.
    var latin = note.latin;
    var english = note.english;

    var posLine = '';
    if (note.note_type === 'vocab' && note.pos) {
      posLine = '<span class="pos">' + escapeHtml(note.pos) + '</span>'
              + (note.lemma ? escapeHtml(note.lemma) : '');
    } else if (note.note_type === 'phrase_pair' && note.role) {
      posLine = '<span class="role">' + escapeHtml(formatRole(note.role)) + '</span>';
    }

    var formsLine = '';
    if (note.forms_summary) {
      formsLine = '<div class="forms">' + escapeHtml(note.forms_summary) + '</div>';
    }

    var prayerLine = '';
    if (note.prayer_id) {
      var prayer = STATIC.prayers.find(function (p) { return p.id === note.prayer_id; });
      if (prayer) prayerLine = '<div class="role">' + escapeHtml(prayer.name) + '</div>';
    }

    // Image always shown on the back; audio plays on flip with replay button.
    var imageBlock = '';
    if (note.image_path && CURRENT_FLIPPED) {
      imageBlock = '<div class="card-image"><img src="' + escapeHtml(note.image_path)
                 + '" alt="" loading="lazy" decoding="async"></div>';
    }
    var audioBlock = '';
    if (note.audio_path && CURRENT_FLIPPED) {
      audioBlock = '<div class="card-audio">'
                 + '<button id="replayBtn" class="audio-btn" type="button" aria-label="Play Latin audio">'
                   + '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">'
                     + '<path fill="currentColor" d="M8 5v14l11-7z"/>'
                   + '</svg>'
                   + '<span>Latin</span>'
                 + '</button>'
                 + '<audio id="cardAudio" preload="auto" src="' + escapeHtml(note.audio_path) + '"></audio>'
                 + '</div>';
    }

    // Interlinear English gloss: small, red, italic, sits ABOVE the Latin
    // — the same convention as a hand-missal interlinear translation.
    var interlinearBlock = CURRENT_FLIPPED
      ? '<div class="interlinear">' + escapeHtml(english) + '</div>'
      : '';

    var html = '<div class="card-section">'
            + '<div class="progress">'
              + '<button id="backBtn">← Back to decks</button>'
              + '<span>' + ACTIVE_DECK.name + ' &middot; reviewed: ' + SESSION_REVIEWS + '</span>'
            + '</div>'
            + '<div class="card" id="cardEl">'
              + imageBlock
              + interlinearBlock
              + '<div class="front">' + escapeHtml(latin) + '</div>'
              + (CURRENT_FLIPPED ?
                  '<div class="back">'
                    + audioBlock
                    + (posLine ? '<div class="meta">' + posLine + '</div>' : '')
                    + formsLine
                    + prayerLine
                  + '</div>'
                : '')
            + '</div>';
    if (!CURRENT_FLIPPED) {
      html += '<button class="reveal-btn" id="revealBtn">Show answer</button>';
    } else {
      var prevState = USER_STATE[CURRENT.id];
      var hint = scheduleHints(prevState);
      html += '<div class="rate-row">'
            + '<button class="rate-btn" data-rating="1">Again<span class="interval-hint">' + hint[1] + '</span></button>'
            + '<button class="rate-btn" data-rating="2">Hard<span class="interval-hint">' + hint[2] + '</span></button>'
            + '<button class="rate-btn" data-rating="3">Good<span class="interval-hint">' + hint[3] + '</span></button>'
            + '<button class="rate-btn" data-rating="4">Easy<span class="interval-hint">' + hint[4] + '</span></button>'
            + '</div>';
    }
    html += '</div>';
    document.getElementById('main').innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', showDeckPicker);
    if (!CURRENT_FLIPPED) {
      document.getElementById('revealBtn').addEventListener('click', flip);
      document.getElementById('cardEl').addEventListener('click', flip);
    } else {
      document.querySelectorAll('.rate-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { rate(parseInt(btn.dataset.rating, 10)); });
      });
      // Auto-play the Latin audio on flip. The flip itself was a user gesture
      // (tap on cardEl or revealBtn), so iOS Safari's autoplay block doesn't
      // bite us. If the user taps the replay button, we restart from zero.
      var audioEl = document.getElementById('cardAudio');
      var replayBtn = document.getElementById('replayBtn');
      if (audioEl) {
        var p = audioEl.play();
        if (p && typeof p.catch === 'function') p.catch(function () { /* user can replay */ });
      }
      if (replayBtn && audioEl) {
        replayBtn.addEventListener('click', function () {
          audioEl.currentTime = 0;
          var pp = audioEl.play();
          if (pp && typeof pp.catch === 'function') pp.catch(function () {});
        });
      }
    }
  }

  function flip() {
    CURRENT_FLIPPED = true;
    renderCard();
  }

  // ─── FSRS-4.5 scheduling ────────────────────────────────────────────────
  // Default open-source weights from the FSRS reference implementation.
  // These can be optimised per-user later from accumulated user_review_log.
  var FSRS_W = [
    0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651,
    0.0234, 1.616, 0.1544, 1.0824, 1.9813, 0.0953, 0.2975,
    2.2042, 0.2407, 2.9466, 0.5034, 0.6567
  ];
  var FSRS_REQUEST_RETENTION = 0.9;
  var FSRS_DECAY = -0.5;
  // FACTOR = 19/81 ≈ 0.2346, derived so that R(t=S, S) = 0.9 exactly
  var FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;
  var FSRS_MAX_INTERVAL = 365 * 5; // cap at 5 years

  function fsrsClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function fsrsInitDifficulty(rating) {
    return fsrsClamp(FSRS_W[4] - (rating - 3) * FSRS_W[5], 1, 10);
  }

  function fsrsInitStability(rating) {
    return Math.max(FSRS_W[rating - 1], 0.1);
  }

  function fsrsNextDifficulty(D, rating) {
    var next = D - FSRS_W[6] * (rating - 3);
    var dInit = fsrsInitDifficulty(3);
    return fsrsClamp(FSRS_W[7] * dInit + (1 - FSRS_W[7]) * next, 1, 10);
  }

  function fsrsRetrievability(elapsedDays, S) {
    return Math.pow(1 + FSRS_FACTOR * elapsedDays / Math.max(S, 0.1), FSRS_DECAY);
  }

  function fsrsNextRecallStability(D, S, R, rating) {
    var hardPenalty = rating === 2 ? FSRS_W[15] : 1;
    var easyBonus = rating === 4 ? FSRS_W[16] : 1;
    return S * (1 + Math.exp(FSRS_W[8])
                * (11 - D)
                * Math.pow(S, -FSRS_W[9])
                * (Math.exp(FSRS_W[10] * (1 - R)) - 1)
                * hardPenalty
                * easyBonus);
  }

  function fsrsNextForgetStability(D, S, R) {
    return FSRS_W[11]
      * Math.pow(D, -FSRS_W[12])
      * (Math.pow(S + 1, FSRS_W[13]) - 1)
      * Math.exp(FSRS_W[14] * (1 - R));
  }

  function fsrsNextInterval(S) {
    var ivl = (S / FSRS_FACTOR) * (Math.pow(FSRS_REQUEST_RETENTION, 1 / FSRS_DECAY) - 1);
    return fsrsClamp(Math.round(ivl), 1, FSRS_MAX_INTERVAL);
  }

  // Compute new card state after a review with the given rating (1..4).
  // Returns the row to upsert into user_card_state.
  function nextSchedule(prev, rating) {
    var now = new Date();
    var prevReps = prev ? (prev.reps || 0) : 0;
    var prevLapses = prev ? (prev.lapses || 0) : 0;
    var prevState = prev ? (prev.state || 0) : 0;
    var prevS = prev ? (prev.stability || 0) : 0;
    var prevD = prev ? (prev.difficulty || 0) : 0;
    var prevReview = prev && prev.last_review ? new Date(prev.last_review).getTime() : 0;
    var elapsedDays = prevReview ? Math.max(0, (now.getTime() - prevReview) / 86400000) : 0;

    var newS, newD, newDays, newDue, newState;
    var newReps = prevReps + 1;
    var newLapses = prevLapses;

    if (prevReps === 0) {
      // First-ever review: initialise from rating
      newD = fsrsInitDifficulty(rating);
      newS = fsrsInitStability(rating);
      if (rating === 1) {
        newState = 1; // learning
        newDays = 0;
        newDue = new Date(now.getTime() + 60 * 1000); // 1 minute
      } else {
        newState = 2; // review
        newDays = fsrsNextInterval(newS);
        newDue = new Date(now.getTime() + newDays * 86400000);
      }
    } else {
      // Subsequent review: update D, S, schedule
      var R = fsrsRetrievability(elapsedDays, prevS);
      newD = fsrsNextDifficulty(prevD || fsrsInitDifficulty(3), rating);
      if (rating === 1) {
        // Lapse — forget stability formula, short relearn step
        newS = fsrsNextForgetStability(newD, prevS || 0.1, R);
        newLapses = prevLapses + 1;
        newState = 3; // relearning
        newDays = 0;
        newDue = new Date(now.getTime() + 10 * 60 * 1000); // 10 minutes
      } else {
        newS = fsrsNextRecallStability(newD, prevS || 0.1, R, rating);
        newState = 2; // review
        newDays = fsrsNextInterval(newS);
        newDue = new Date(now.getTime() + newDays * 86400000);
      }
    }

    return {
      due: newDue.toISOString(),
      scheduled_days: newDays,
      elapsed_days: Math.round(elapsedDays),
      stability: Number(newS.toFixed(4)),
      difficulty: Number(newD.toFixed(4)),
      reps: newReps,
      lapses: newLapses,
      state: newState,
      last_review: now.toISOString(),
    };
  }

  // What interval will each rating button produce? Used for the hints under
  // the rate buttons so the user can see the schedule before they tap.
  function scheduleHints(prev) {
    var hints = {};
    for (var rating = 1; rating <= 4; rating++) {
      var sim = nextSchedule(prev, rating);
      if (rating === 1) {
        hints[rating] = prev && prev.reps > 0 ? '10m' : '<1m';
      } else {
        hints[rating] = humanInterval(sim.scheduled_days);
      }
    }
    return hints;
  }

  function humanInterval(days) {
    if (days < 1) return '<1d';
    if (days < 30) return days + 'd';
    if (days < 365) return Math.round(days / 30) + 'mo';
    return (days / 365).toFixed(1) + 'y';
  }

  function rate(rating) {
    var prev = USER_STATE[CURRENT.id];
    var nextState = nextSchedule(prev, rating);
    var elapsedDays = prev && prev.last_review
      ? Math.max(0, Math.round((Date.now() - new Date(prev.last_review).getTime()) / 86400000))
      : 0;

    // optimistic local update
    USER_STATE[CURRENT.id] = {
      card_id: CURRENT.id,
      due: nextState.due,
      stability: nextState.stability,
      difficulty: nextState.difficulty,
      reps: nextState.reps,
      lapses: nextState.lapses,
      state: nextState.state,
      last_review: nextState.last_review,
      scheduled_days: nextState.scheduled_days,
    };

    var userId = SESSION.user.id;
    var upsert = Object.assign({ user_id: userId, card_id: CURRENT.id, updated_at: nextState.last_review }, nextState);
    var logEntry = {
      user_id: userId,
      card_id: CURRENT.id,
      rating: rating,
      review_time: nextState.last_review,
      scheduled_days: nextState.scheduled_days,
      elapsed_days: elapsedDays,
      state_before: prev ? prev.state : 0,
      state_after: nextState.state,
    };

    // Fire-and-forget through rest() so a 401 (e.g. mid-session token expiry)
    // transparently refreshes and retries instead of silently dropping the
    // write.
    rest('/user_card_state?on_conflict=user_id,card_id', SESSION, {
      method: 'POST',
      body: upsert,
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    }).catch(function (e) { console.warn('save state failed', e); });

    rest('/user_review_log', SESSION, {
      method: 'POST',
      body: logEntry,
      headers: { 'Prefer': 'return=minimal' },
    }).catch(function (e) { console.warn('save review failed', e); });

    SESSION_REVIEWS += 1;
    nextCard();
  }

  // ─── Done state ─────────────────────────────────────────────────────────
  function showDone() {
    var main = document.getElementById('main');
    main.innerHTML = '<div class="done">'
                   + '<h2>Session complete</h2>'
                   + '<p>You reviewed ' + SESSION_REVIEWS + ' card' + (SESSION_REVIEWS === 1 ? '' : 's') + '.</p>'
                   + '<button class="reveal-btn" id="backBtn">← Back to decks</button>'
                   + '</div>';
    document.getElementById('backBtn').addEventListener('click', showDeckPicker);
  }

  function showErr(msg) {
    document.getElementById('main').innerHTML = '<div class="err-msg">' + escapeHtml(msg) + '</div>';
  }

  // ─── Utils ──────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatRole(r) {
    if (!r) return '';
    return r.charAt(0).toUpperCase() + r.slice(1);
  }
</script>

</body>
